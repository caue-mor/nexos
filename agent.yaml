spec_version: "0.1.0"
name: nexos-cli
version: 6.1.1
description: "NexOS — AI Software House for Claude Code. 17 specialist agents, 760 skills with declarative manifest, 11 hook lifecycle events, drift detection, instinct learning, governance capture."
author: NexOS Team
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-6
agents:
  - nexos-master
  - nexos-analyst
  - nexos-pm
  - nexos-architect
  - nexos-dba
  - nexos-security
  - nexos-ux
  - nexos-frontend
  - nexos-dev
  - nexos-backend
  - nexos-ai-engineer
  - nexos-qa
  - nexos-performance
  - nexos-devops
  - nexos-sm
  - nexos-po
  - nexos-drift-detector
hooks:
  profiles:
    - minimal
    - standard
    - strict
  count: 20
features:
  - memory-persistent
  - agent-memory-individual
  - install-wizard
  - hook-profiles
  - install-profiles
  - config-protection
  - edit-accumulator
  - batch-format-typecheck
  - desktop-notifications
  - governance-capture
  - instinct-learning
  - cost-tracking
  - error-capture
  - session-continuity
  - context-compaction-resistant
tags:
  - ai-software-house
  - specialist-agents
  - claude-code
  - enterprise-quality
  - multi-agent
