<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXOS</title>
<!-- Favicon inline (data:), sem arquivo novo: o painel é um HTML único
     aberto por file://, e um .ico à parte só criaria um segundo arquivo
     pra manter em sincronia com a paleta. Orbe simplificado — o mesmo
     fósforo verde do canvas #orb, num quadrado do --void da direção B. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23060A08'/%3E%3Ccircle cx='16' cy='16' r='9' fill='%237CFF9E'/%3E%3C/svg%3E">
<style>/*__TAILWIND__*/</style>
<style>
  /* Direção B "JARVIS HUD", aprovada pelo dono em 23/09
     (scratchpad/ux/direcao-b-jarvis-hud.html) — fósforo verde sobre painel
     opaco, âmbar para atenção. Os mesmos seis papéis de cor do SDK anterior
     (NexOS-Visual-SDK-v0.3.0) continuam existindo; só o valor mudou, e
     design-tokens.test.mjs trava que os três arquivos concordem. */
  :root{
    --bg:#060A08; --surface:#0C1613; --grid:rgba(124,255,158,.06);
    --primary:#7CFF9E; --primary-dim:#4C8F63; --text:#DCEBE1; --muted:#6E8577;
    --warning:#FFB454; --danger:#FF5C6C; --info:#5FD8FF;
    --line:rgba(124,255,158,.22);
    /* Só a prosa (frase escrita por gente, ex.: o resumo de uma decisão)
       usa --sans — código, dado e rótulo continuam no monoespaçado do
       `body`. Mesmo recorte da maquete aprovada (linha 139 dela). */
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  /*   A TELA INTEIRA É O CONTÊINER, NÃO O CONTEÚDO
   *
   * Medido a 3440x1296: o conteúdo terminava em 633px e sobravam 663px de
   * fundo vazio, com a barra de abas parada no meio da tela. `body` não era
   * flex, então nada esticava para ocupar a altura.
   *
   * Coluna de altura mínima 100vh, `main` cresce (`flex:1`).
   */
  body{
    background:var(--bg);color:var(--text);
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,"Cascadia Mono",monospace;
    /* Sem grade de fundo: a malha competia com o núcleo e sujava a tela. */
    min-height:100vh;display:flex;flex-direction:column;
  }
  header{padding:14px 22px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--surface);position:sticky;top:0;z-index:21}
  h1{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary)}
  /* Alvo de 24px também aqui: medido a 390px, o link do mapa tinha 22px de
     altura. É o mesmo mínimo do WCAG 2.5.8 que o rótulo de seção já
     respeita — regra de alvo vale para TODO clicável, não para o que foi
     medido da última vez. */
  /* Alvo de 44px (WCAG 2.5.8): `padding` sozinho não bastava porque o link
     é `inline-block` só com `padding-block` — a altura da CAIXA seguia a
     linha de texto (30px), não o padding. `inline-flex` com
     `align-items:center` faz a caixa ter a altura que `min-height` pede e
     centraliza o texto dentro dela, em vez de crescer só pra baixo. */
  header a{display:inline-flex;align-items:center;min-height:44px;padding:0}
  /*   BARRA DE ABAS NO RODAPÉ ESCONDIA O FIM DO CONTEÚDO
   *
   * Medido pelo QA: `nav{position:sticky;bottom:0}` flutuava sobre a cauda
   * do painel enquanto o usuário ainda rolava — e vinha DEPOIS de `main` no
   * DOM, então o teclado percorria a aba inteira antes de alcançar a
   * navegação. As duas coisas se corrigem juntas: `nav` muda de lugar no
   * HTML (antes de `main`, logo abaixo do `header`) e de `bottom` para
   * `top`. Sem barra flutuando sobre o fim de nada — o conteúdo passa a
   * fluir normalmente ABAIXO da navegação, nunca atrás dela.
   */
  /* `top` é o valor de primeira pintura, só até o script medir a altura
     real do cabeçalho (ele quebra linha em telas estreitas quando o
     caminho é longo) e corrigir — ver sincronizarTopoNav(). Um número fixo
     aqui sozinho ficaria certo numa largura e sobrepondo o cabeçalho em
     outra. */
  nav{display:flex;gap:2px;padding:0 14px;border-bottom:1px solid var(--line);overflow-x:auto;
      background:var(--surface);position:sticky;top:53px;z-index:20}
  nav button{background:none;border:0;color:var(--muted);position:relative;
             padding:10px 14px;cursor:pointer;font:inherit;white-space:nowrap;letter-spacing:.04em;min-height:44px}
  nav button:hover{color:var(--text)}
  /*   A ABA ATIVA NÃO PODE MUDAR A PRÓPRIA CAIXA
   *
   * A marca antiga trocava borda (2px) e compensava com margin-top:-2px —
   * o resultado visual parecia certo, mas o box model da aba selecionada
   * ficava ~2px mais alto que o das outras. Medido: a barra de abas lia
   * DUAS linhas (`getBoundingClientRect().top` arredondado divergia entre
   * a aba ativa e as demais) mesmo sendo, visualmente, uma linha só.
   *
   * Colchetes em `::before`/`::after`, absolutos: marcam sem mexer em
   * borda, padding ou margem do botão — a caixa de toda aba mede o mesmo,
   * ativa ou não.
   */
  nav button[aria-selected="true"]{color:var(--primary)}
  nav button[aria-selected="true"]::before,
  nav button[aria-selected="true"]::after{content:"";position:absolute;top:4px;bottom:4px;width:6px;border-color:var(--primary)}
  nav button[aria-selected="true"]::before{left:3px;border-left:2px solid;border-top:2px solid;border-bottom:2px solid}
  nav button[aria-selected="true"]::after{right:3px;border-right:2px solid;border-top:2px solid;border-bottom:2px solid}
  /*   `flex-basis:0` GANHA DE `width`, E O ITEM SOME
   *
   * `flex:0 0 0` declarava `flex-basis:0` — que decide o tamanho no eixo
   * principal de um item flex ANTES do `width`, exceto quando o basis é
   * `auto`. Com o basis travado em 0 e grow/shrink também em 0, o item
   * nunca cresce até os 28px do `width` — ele rendeirizava com 0px de
   * largura, e a pista de rolagem nunca aparecia (achado do QA, LOW: some
   * a 390/768, mas era em qualquer largura). `flex:none` (0 0 auto) deixa
   * o `width` decidir, do jeito que a regra sempre pareceu fazer.
   *
   * Some do fluxo (`content:''`) e vira item flex "sticky" que se prende à
   * borda direita ENQUANTO a própria `nav` rola — mesmo truque de "scroll
   * shadow" sem JavaScript. */
  nav::after{content:"";position:sticky;top:0;right:0;flex:none;width:28px;margin-left:-28px;
             pointer-events:none;background:linear-gradient(90deg,transparent,var(--surface))}
  /*   LARGURA DE LEITURA != LARGURA DA JANELA
   *
   * 1180px fixos deixavam 2/3 de um monitor de 3440px em branco, com tudo
   * encostado à esquerda. Tabela de dados ganha com largura; prosa não. O
   * teto sobe para 1720px e o bloco CENTRALIZA — em telas menores o `min()`
   * devolve 100% e nada muda.
   */
  main{padding:20px clamp(1rem,2vw,1.5rem);width:100%;margin:0;flex:1;
       display:flex;flex-direction:column}

  /*   PAINEL NÃO OBEDECE LARGURA DE LEITURA
   *
   * O teto de 1720px existe para TEXTO e tabela: linha longa demais cansa.
   * A Visão geral não é leitura — é instrumento, e instrumento usa o vidro
   * inteiro. Medido a 3440px: o HUD ficava com 1676px (49% da tela) e 882px
   * de margem morta de cada lado.
   *
   * `margin-inline: calc(50% - 50vw)` tira o bloco do contêiner centralizado
   * sem precisar mudar a árvore. As outras abas continuam limitadas.
   *
   *   MAS "USAR O VIDRO INTEIRO" TEM QUE PARAR EM ALGUM LUGAR
   *
   * Sem teto, a 3440px o HUD vira 3396px de largura — e ninguém pediu pra
   * ele cobrir tudo isso: rodada 3 mediu laterais de 268px (do layout de
   * rodapé antigo, removido) e orbe gigante num vão vazio. `min(100vw,
   * 1680px)` resolve as duas larguras com um valor só: abaixo de 1680px de
   * janela ele devolve 100vw (nada muda do full-bleed medido e aprovado);
   * a partir dali, trava em 1680px. `margin-inline:auto` só centraliza
   * DE VERDADE quando a largura já cabe no container (abaixo de 1680px,
   * onde a largura sempre extrapola o container, o navegador resolve as
   * margens automáticas pra 0 — por isso a versão estreita continua
   * dependendo do `calc(50% - 50vw)` de antes, e as duas regras convivem
   * porque cada uma só "vence" na faixa onde faz sentido.
   */
  section[data-name="Visão geral"]{
    width:100vw;margin-inline:calc(50% - 50vw);padding-inline:22px;
    flex:1;display:flex;flex-direction:column;gap:0;
  }
  @media (min-width:1680px){
    section[data-name="Visão geral"]{width:1680px;margin-inline:auto}
    /*   O FUNDO PODE IR DE BORDA A BORDA; O CONTEÚDO, NÃO
     *
     * Medido pelo QA a 3440px: cabeçalho e faixa de seções continuavam
     * `padding-inline` fixo (22px/14px) — o FUNDO delas já ia de ponta a
     * ponta (nunca tiveram teto de largura), mas o conteúdo ficava colado
     * na borda esquerda da TELA, enquanto a "Visão geral" logo abaixo
     * está centralizada na coluna de 1680px. Resultado: o primeiro item
     * da nav não alinhava com o começo do HUD.
     *
     * `padding-inline: calc((100vw - 1680px) / 2)` empurra só o CONTEÚDO
     * pra a mesma coluna, sem tocar o `background` de cada barra — que
     * continua preenchendo a largura toda do elemento.
     */
    header, nav{padding-inline:calc((100vw - 1680px) / 2)}
  }
  /*   ESPAÇO VAZIO NÃO É ESPAÇO USADO
   *
   * Dar `flex:1` ao HUD fazia ele esticar até 1027px com 120px de conteúdo —
   * deserto com o orbe flutuando no meio. O painel superior fica DENSO, com
   * altura própria, e o espaço que sobra vai para "Precisa de você", que é o
   * que o dono precisa ler primeiro.
   */
  /*   O NÚCLEO É O CENTRO DA VISÃO GERAL, NÃO UM ITEM DA PÁGINA
   *
   * A direção B mantém cabeçalho e faixa de seções em toda largura — não
   * existe mais o modo "sem moldura" que só valia >=1500px. O que continua
   * valendo aqui embaixo é o HUD tomar a altura que sobra dentro da aba
   * (sem cabeçalho/faixa) e o orbe crescer com ela, dentro do teto acima.
   */
  section[data-name="Visão geral"] > .hud{flex:1;min-height:0}
  section[data-name="Visão geral"] > .mission[hidden]{display:none}
  /*   NUMA COLUNA ESTREITA, NÚMERO E FRASE NÃO CABEM LADO A LADO
   *
   * Com os alertas dentro da lateral de 300px, `flex-direction:row` quebrava
   * a frase em três linhas e deixava o número colado e minúsculo. Empilhado,
   * o número mantém a grandeza e a frase lê como legenda dele.
   */
  .alerta{display:flex;flex-direction:column;align-items:flex-start;gap:0;
          padding:7px 8px;margin-block:2px;margin-inline:-8px}
  .alerta .qtd{font-size:26px;font-weight:600;line-height:1.05}
  .alerta > span{font-size:12px;color:var(--muted);line-height:1.45}
  .alerta.req .qtd{color:var(--warning)}
  .alerta.blk .qtd{color:var(--danger)}
  .alerta.ir:hover > span{color:var(--text)}
  .mission h2{font-size:12px}
  section[hidden]{display:none}
  h2{font-size:12px;color:var(--primary-dim);text-transform:uppercase;letter-spacing:.12em;margin:22px 0 10px}
  h2:first-child{margin-top:0}
  /* 5 colunas fixas: 6 e 7 cards quebravam a fileira e deixavam um órfão sozinho */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px 14px;min-height:74px;display:flex;flex-direction:column;justify-content:center}
  .card b{display:block;font-size:22px;font-variant-numeric:tabular-nums;line-height:1.15;color:var(--text)}
  .card span{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.09em;margin-top:4px}
  table{width:100%;border-collapse:collapse;margin-top:4px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:400;font-size:12px;text-transform:uppercase;letter-spacing:.09em}
  .mono{font-size:12px;word-break:break-all}
  .muted{color:var(--muted)}
  .ok{color:var(--primary)}.drift{color:var(--warning)}.blocked{color:var(--danger)}.unknown{color:var(--info)}
  .na{opacity:.55;font-style:italic}
  /*   A TRILHA SAÍA DA JANELA, NÃO SÓ O PREENCHIMENTO
   *
   * Medido a 390px: a trilha (a caixa `.bar`, não a `i` de dentro) tinha o
   * próprio `right` além da largura da janela. Causa: a largura vinha de
   * `style="width:38%"` na `<td>` que a contém — e a 390px a tabela vira
   * `display:block` (regra abaixo), onde a célula de uma tabela em modo
   * bloco não tem mais o algoritmo de coluna do `table` pra segurar esse
   * percentual contra a largura VISÍVEL da linha. `overflow:hidden` na
   * trilha escondia o sintoma (o preenchimento cortado) sem esconder a
   * causa: a caixa em si media mais que a janela.
   *
   * Fixo em pixel na trilha em vez de percentual na célula: não depende de
   * qual algoritmo de tabela está ativo. */
  .bar{width:min(160px,100%);height:5px;background:rgba(124,255,158,.1);border-radius:2px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--danger)}
  .note{background:var(--surface);border-left:2px solid var(--warning);padding:10px 14px;border-radius:0 4px 4px 0;margin:10px 0;line-height:1.6}
  .tag{display:inline-block;padding:1px 7px;border-radius:3px;font-size:12px;letter-spacing:.06em;border:1px solid currentColor}
  a{color:var(--info)}
  /* Tabela longa rola dentro de si, em vez de esticar a página em 6000px */
  .scroll{max-height:460px;overflow-y:auto;border:1px solid var(--line);border-radius:4px}
  .scroll table{margin-top:0}
  .scroll th{position:sticky;top:0;background:var(--bg)}

  /* Linha de tabela que abre detalhe: o cursor precisa dizer isso ANTES do
     clique. 390 linhas pareciam clicáveis e não eram — foi a primeira coisa
     que o dono notou usando. */
  /*   CLICÁVEL PRECISA PARECER CLICÁVEL, E SER ALCANÇÁVEL
   *
   * `.ir` marca o que navega para outra aba. Cursor e sublinhado pontilhado
   * avisam ANTES do clique; `:focus-visible` com anel de 2px porque o anel
   * padrão do navegador some contra #060A08.
   */
  /*   A GRANDEZA PRECISA SER VISÍVEL SEM LEITURA
   *
   * Rótulo miúdo em cima, número grande embaixo, barra de proporção quando o
   * valor é fração. É o que separa painel de lista: dá para bater o olho e
   * saber o estado sem ler uma palavra.
   */
  .metrica{display:flex;flex-direction:column;gap:1px;padding:6px 0}
  .metrica .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .metrica .num{font-size:30px;line-height:1.05;color:var(--text);font-weight:600;letter-spacing:-.02em}
  .metrica .num i{font-size:15px;font-style:normal;color:var(--muted);font-weight:400}
  .metrica .nota{font-size:12px;color:var(--muted)}
  .metrica .barra{display:block;height:3px;background:var(--line);margin-top:6px;border-radius:2px;overflow:hidden}
  .metrica .barra i{display:block;height:100%;background:var(--primary);opacity:.85}
  .metrica.ir:hover .num{color:var(--primary)}
  .metrica.ir:hover .barra i{opacity:1}
  @media (min-width:1500px){ .metrica .num{font-size:38px} }
  .ir{cursor:pointer;transition:color .15s,background .15s}
  /* Alvo de toque mínimo 24x24 (WCAG 2.2): os alertas mediam 23,2px de altura. */
  /* Uma regra só para `.alerta`: a duplicada abaixo reimpunha
     `align-items:center` por ordem e recentralizava o número. */
  .alerta{min-height:26px;border-radius:3px}
  h2.rotulo-hud{margin:0 0 10px}
  .ir:hover{color:var(--primary)}
  /*   ALVO PEQUENO DEMAIS PARA ACERTAR
   *
   * Medido: 308x16px. O mínimo do WCAG 2.2 (2.5.8, nível AA) é 24x24 — e
   * 16px de altura num rótulo de 10px é difícil de acertar com o mouse e
   * pior ainda com o dedo. O Lighthouse dá 100 e não pega isto: ele não
   * audita tamanho de alvo em desktop.
   *
   * O padding cresce a área clicável e a margem negativa devolve o espaço,
   * então nada se move na tela — o alvo fica maior sem o layout mudar um
   * pixel. */
  h2.rotulo-hud.ir{
    text-decoration:underline dotted var(--primary-dim);text-underline-offset:3px;
    padding-block:4px;margin-block:-4px 6px;
  }
  h2.rotulo-hud.ir:hover{text-decoration-color:var(--primary)}
  .kv.ir:hover{background:rgba(124,255,158,.06);margin-inline:-6px;padding-inline:6px;border-radius:3px}
  .mission .ir:hover{background:rgba(124,255,158,.06)}
  .ir:focus-visible,tr[data-open]:focus-visible,nav button:focus-visible,a:focus-visible,
  .paginacao button:focus-visible,
  section:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
  section:focus-visible{outline-offset:-2px}
  tr[data-open]{cursor:pointer}
  /* Sem isto o foco do teclado some no tema escuro: o anel padrão do
     navegador tem contraste baixo contra #060A08. `.paginacao button`
     ficou de fora quando a paginação foi criada (achado do verificador)
     — mesmo problema, mesmo remédio dos outros clicáveis. */
  tr[data-open]:focus-visible,nav button:focus-visible,a:focus-visible,
  .paginacao button:focus-visible{
    outline:2px solid var(--primary);outline-offset:-2px}
  tr[data-open]:hover{background:rgba(124,255,158,.06)}
  tr[data-open].aberta{background:rgba(124,255,158,.09)}
  .detalhe{padding:10px 14px;background:var(--surface);border-left:2px solid var(--primary)}
  .detalhe dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0}
  .detalhe dt{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
  .detalhe dd{margin:0;word-break:break-word}

  /* RESPONSIVIDADE — o painel foi construído numa largura só e nunca medido
     em outra. Medido: nav transbordava abaixo de 1440px e o HUD de 3 colunas
     fixas (260px|1fr|260px) era inviável em telefone. */
  
  
  

  /* HUD — estrutura de Control Surface do Visual SDK v0.3.0 (doc 01):
     laterais de estado, centro com o orbe como INSTRUMENTO de estado (não
     decoração) e registro de missão embaixo. O que não temos medido aparece
     como lacuna declarada, nunca como número simulado. */
  /* Sem `gap:1px` sobre fundo de linha: aquilo desenhava as divisórias que
     cercavam o painel. As colunas se separam por espaço, não por traço. */
  .hud{display:grid;grid-template-columns:260px 1fr 260px;gap:0 28px;align-items:stretch}
  .hud > div{background:var(--bg);padding:14px 16px}
  .hud .rotulo-hud{font-size:12px;color:var(--primary-dim);text-transform:uppercase;letter-spacing:.12em;margin:0 0 10px}
  .hud .rotulo-hud:not(:first-child){margin-top:18px}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:12px}
  /*   VALOR SEM PONTO DE QUEBRA VAZA A CAIXA, NÃO É EMBELEZAMENTO
   *
   * Item flex tem `min-width:auto` por padrão — recusa encolher abaixo da
   * largura do próprio conteúdo, então um `ramo` comprido (ex.:
   * "feat/algum-nome-de-branch-longo") empurrava a caixa para fora da
   * janela em vez de quebrar linha. `min-width:0` libera o encolhimento;
   * `overflow-wrap:break-word` quebra em "/" e "-" quando existem, e só
   * corta no meio de uma palavra sem NENHUM ponto de quebra — nunca
   * `break-all`, que cortaria toda palavra normal também. */
  .kv b{color:var(--text);font-variant-numeric:tabular-nums;overflow-wrap:break-word;min-width:0;text-align:right}
  .kv .lbl{color:var(--muted);flex-shrink:0}
  /*   O CENTRO NÃO PODE ESTICAR ATÉ A ALTURA DA COLUNA MAIS ALTA
   *
   * `.hud{align-items:stretch}` (herdado, é o padrão do grid) faz TODA
   * coluna da linha esticar até a altura da mais alta — e "Visão geral"
   * tem colunas laterais com vários `.bloco`, facilmente mais altas que
   * o núcleo. Esticado, `justify-content:center` centraliza o orbe no
   * MEIO dessa caixa esticada — que pode ir muito além da primeira tela.
   * Medido a 1440px: orbe e status caindo perto de y=740-900, fora do
   * que cabe sem rolar.
   *
   * `align-self:start` tira só esta coluna do estica-e-centraliza: ela
   * fica do tamanho do PRÓPRIO conteúdo, ancorada no topo da linha.
   */
  .hud-center{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;align-self:start}
  #orb{width:100%;max-width:420px;height:240px;display:block}
  .orb-state{font-size:12px;letter-spacing:.3em;color:var(--primary-dim);text-transform:uppercase}
  .orb-name{font-size:26px;letter-spacing:.14em;color:var(--primary);margin:2px 0 4px}
  .orb-sub{font-size:12px;color:var(--muted);text-align:center;max-width:340px}
  .mission{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
  .mission div{padding:2px 0;font-size:12px}
  .mission .req{color:var(--warning)}
  .mission .blk{color:var(--danger)}
  .gap{color:var(--muted);font-style:italic;font-size:12px;padding:2px 0}

  /*   OCUPAR A TELA != ESTICAR O CONTEÚDO
   *
   * Medido a 3440px logo depois do full-bleed: as colunas ficaram
   * `260px | 2872px | 260px` — duas tiras de dados coladas nas bordas e um
   * deserto no meio. Preencher a largura não é usá-la — resolvido abaixo
   * limitando a própria "Visão geral" a um teto de largura, em vez de
   * deixar o HUD crescer sem fim (ver seção da aba mais abaixo).
   *
   * A primeira tentativa distribuiu os ITENS em grid e embaralhou tudo:
   * "Instalação" apareceu com `ramo`, "Não medimos ainda" com `commit`.
   * Por isso cada seção virou `bloco` no HTML — o grid move BLOCOS, e
   * rótulo e dados viajam juntos.
   */
  /*   CADA COLUNA EMPILHA SOZINHA, NÃO DISTRIBUÍDA PELA ALTURA DO PAINEL
   *
   * `align-content:space-between` espalhava os blocos ao longo da altura
   * da LINHA do grid — e como cada coluna lateral pode ter altura
   * diferente da outra (números de itens diferentes), os blocos de uma
   * coluna não alinhavam com os da outra: medido a 1440/1920, "Ferramentas"
   * (2º bloco da direita) caía bem mais embaixo que "Instalação" (2º
   * bloco da esquerda). `flex-direction:column` empilha cada coluna a
   * partir do topo, do jeito da maquete — sem depender da altura da
   * coluna vizinha.
   */
  .col{display:flex;flex-direction:column;gap:22px}
  /*   MOLDURA DE CANTOS, NÃO CAIXA FECHADA
   *
   * A maquete aprovada usa colchete nos quatro cantos (dois `::before`/
   * `::after` do elemento, dois `<span class="bl"/"br">` extra no HTML).
   * Aqui os cantos de cima saem de `::before`/`::after` — únicos pseudo-
   * elementos que um nó tem — e uma borda fina de 1px fecha o retângulo:
   * o efeito de "painel de instrumento" sem precisar tocar `bloco()` e
   * arriscar os testes que já travam a forma do que ela devolve.
   */
  .bloco{
    min-width:0;position:relative;background:var(--surface);
    border:1px solid var(--line);padding:14px 16px 12px;
  }
  .bloco::before,.bloco::after{
    content:"";position:absolute;top:-1px;width:11px;height:11px;border-color:var(--primary-dim);
  }
  .bloco::before{left:-1px;border-left:2px solid;border-top:2px solid}
  .bloco::after{right:-1px;border-right:2px solid;border-top:2px solid}
  /*   CANAL ÂMBAR: O QUE PRECISA DE VOCÊ NÃO PODE PARECER MAIS UM BLOCO
   *
   * `:has()` acha o bloco "Precisa de você" pelo que ele CONTÉM (linhas
   * `.alerta`, únicas nesse bloco) em vez de um parâmetro novo em
   * `bloco()` — zero risco de derrubar `navegacao-contract.test.mjs`, que
   * trava a assinatura de `bloco()` e o que ela devolve.
   */
  .bloco:has(> .alerta){border-color:var(--warning)}
  .bloco:has(> .alerta)::before,.bloco:has(> .alerta)::after{border-color:var(--warning)}
  .bloco:has(> .alerta) > h2{color:var(--warning)}
  /*   1440 NÃO É "TELA GRANDE", É A LARGURA MAIS COMUM DE DESKTOP
   *
   * Abaixo de 1180 (colapso de 2 colunas) o HUD ficava preso nos 260px da
   * regra base — mesma largura de coluna de um notebook pequeno. Medido a
   * 1440x900 na maquete aprovada: laterais ~436px, centro ~300px fixo.
   * `1fr` nas laterais entrega essa largura sem outro número mágico — elas
   * absorvem o que sobra da tela.
   *
   * Sem teto superior aqui: quem impede o HUD de esticar sem fim numa tela
   * 3440px não é uma segunda faixa de breakpoint pro HUD, é a PRÓPRIA aba
   * "Visão geral" ter um teto de largura (ver a regra dela, mais abaixo) —
   * um teto só, no lugar que de fato limita, em vez de um por tamanho de
   * tela. Removida a faixa de layout de rodapé/coluna lateral que existia
   * só >=1500px (grid-areas, nav vertical, header no rodapé): contradizia
   * a direção B aprovada, que é cabeçalho + faixa de seções em TODA
   * largura — medido pelo QA a 3440px: laterais de 268px, orbe gigante,
   * muito vazio, header empurrado pro rodapé da coluna.
   */
  @media (min-width:1180px){
    .hud{grid-template-columns:1fr 320px 1fr;gap:0 32px}
  }

  /*   O QUE ROLA É O CONTEÚDO, NÃO A PÁGINA
   *
   * Medido nas dez abas: o conteúdo vai de 211px ("Pesquisas") a 1938px
   * ("Trabalho feito"), e a página inteira rolava junto — os cartões de
   * resumo sumiam do topo assim que se procurava algo na tabela, que é
   * exatamente quando eles importam.
   *
   * A faixa de cartões gruda no topo da área rolável e o resto desliza por
   * baixo. Sem JavaScript: `position:sticky` com fundo OPACO, porque sem o
   * fundo o texto da tabela passa por trás do cartão e fica ilegível.
   */
  section > .cards:first-of-type{
    position:sticky;top:0;z-index:10;
    background:var(--bg);padding:2px 0 14px;
    margin-bottom:2px;box-shadow:0 10px 18px -12px var(--bg);
  }

  /*   CARTÃO É COMPONENTE, NÃO CAIXA COM BORDA
   *
   * Eram retângulos com traço em volta, todos iguais e sem estado. Agora têm
   * superfície própria, realce na borda de cima que muda com a severidade, e
   * resposta ao ponteiro — o mesmo vocabulário do resto da tela.
   */
  .cards > div{
    position:relative;background:var(--surface);border:1px solid var(--line);
    border-radius:6px;padding:14px 16px;overflow:hidden;
    transition:border-color .18s ease,transform .18s ease,box-shadow .18s ease;
  }
  .cards > div::before{
    content:'';position:absolute;inset:0 0 auto 0;height:2px;
    background:var(--primary);opacity:.3;transition:opacity .18s ease;
  }
  .cards > div:hover{
    border-color:var(--primary-dim);transform:translateY(-1px);
    box-shadow:0 6px 20px -12px var(--primary);
  }
  .cards > div:hover::before{opacity:.9}
  .cards > div.blocked::before{background:var(--danger);opacity:.7}
  .cards > div.drift::before,.cards > div.unknown::before{background:var(--warning);opacity:.6}

  /* Tabela longa rola no próprio quadro, com o cabeçalho fixo dentro dele. */
  .scroll{max-height:min(58vh,760px);overflow:auto;border:1px solid var(--line);border-radius:6px}
  .scroll table{border:0}
  .scroll thead th{position:sticky;top:0;background:var(--surface);z-index:2}
  .paginacao{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin-top:8px;font-size:12px;
  }
  .paginacao button{
    background:none;color:var(--primary);border:1px solid var(--line);border-radius:4px;
    min-height:44px;padding:0 16px;cursor:pointer;font:inherit;letter-spacing:.03em;
  }
  /* Bloco empilhado pra prosa que não cabe em coluna de tabela (ver
     "Perguntas que a análise levanta"): teto de altura próprio, rola
     dentro de si — mesmo papel do `.scroll` de tabela, tamanho pedido
     à parte porque aqui não tem cabeçalho fixo pra compensar. */
  .lista-perguntas{max-height:600px;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:6px}
  .item-pergunta{border-top:1px dashed var(--line);padding-top:10px}
  .item-pergunta:first-child{border-top:0;padding-top:0}
  .item-pergunta p{margin:4px 0 0;font-family:var(--sans)}
  .item-pergunta .muted{margin-top:3px}
  .paginacao button:hover:not(:disabled){border-color:var(--primary-dim)}
  .paginacao button:disabled{color:var(--muted);cursor:default;opacity:.5}

  /*   MOVIMENTO EXPLICA MUDANÇA — E SÓ ISSO
   *
   * Transição existe para o olho acompanhar o que mudou de lugar, nunca para
   * enfeitar. Duração curta (150-220ms) e só em `opacity`/`transform`, que o
   * navegador compõe sem recalcular layout.
   *
   * `prefers-reduced-motion` desliga tudo: para quem marcou essa preferência,
   * animação é sintoma, não recurso.
   */
  @keyframes entrar{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  section[role=tabpanel]:not([hidden]){animation:entrar .22s ease-out}
  .bloco{animation:entrar .26s ease-out both}
  .col > .bloco:nth-child(2){animation-delay:.04s}
  .col > .bloco:nth-child(3){animation-delay:.08s}
  .col > .bloco:nth-child(4){animation-delay:.12s}
  tr[id]:not([hidden]) .detalhe{animation:entrar .18s ease-out}

  /* A linha ativa acende em vez de só mudar de fundo. */
  tr[data-open].aberta{box-shadow:inset 2px 0 0 var(--primary)}
  .metrica .barra i{transition:width .5s cubic-bezier(.22,.61,.36,1)}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
                         transition-duration:.001ms!important;scroll-behavior:auto!important}
  }

  /*   O TETO DE LARGURA VAI NA TABELA, NUNCA NA CÉLULA
   *
   * Auditadas as dez abas a 3440px: cinco tinham coluna desproporcional, a
   * pior com 111px contra 2644px. A primeira correção pôs `max-width:74ch`
   * no `td` — e o navegador reportou `max-width: 623px` computado numa
   * coluna RENDERIZADA com 2248px:
   *
   *     max-width EM CÉLULA NÃO EXISTE PARA `table-layout:auto`
   *
   * O algoritmo de tabela distribui o espaço pela largura do CONTEÚDO e
   * ignora o teto da célula. Quem aceita teto é a tabela, que é um bloco.
   * `td` guarda só a quebra de palavra, que é o que ele de fato controla.
   *
   * 120ch é medida da própria fonte, não pixel arbitrário: é onde uma
   * tabela de três colunas ainda tem proporção antes de a coluna de texto
   * comer o resto da tela.
   */
  table{max-width:120ch}
  /*   ROLAGEM PRÓPRIA VALE EM QUALQUER LARGURA, NÃO SÓ NO CELULAR
   *
   * Media a 768px, aba Saúde: a rolagem dentro da própria tabela só
   * ligava (`display:block;overflow-x:auto`) abaixo de 720px — 768 ficava
   * de fora, e o documento inteiro passava a rolar de lado (823px contra
   * janela de 768px). O mecanismo vale em qualquer largura: se a tabela
   * já coubesse, `overflow-x:auto` não faz nada; sobrando conteúdo, ela
   * rola dentro de si em vez de empurrar a página — em 390px ou 3440px.
   */
  table{display:block;overflow-x:auto}
  /*   `anywhere` ENTRA NA LARGURA MÍNIMA; `break-word` NÃO
   *
   * Medido na mesma tabela, só trocando o valor: com `anywhere` a coluna
   * "evidência" ficava com 78px e o caminho quebrava letra a letra; com
   * `break-word`, 286px. Os dois quebram palavra longa — mas `anywhere`
   * também informa ao algoritmo de tabela que a largura mínima daquela
   * coluna é UM CARACTERE, e o algoritmo acredita. */
  td{overflow-wrap:break-word;white-space:normal}
  td.mono,td:has(.tag),th{white-space:nowrap}
  /* Selo + frase é prosa: `td:has(.tag)` travava a linha e a coluna "sugestões"
   * da aba Saúde chegou a 970px (documento 1388px numa janela de 1200). */
  td.prosa{white-space:normal}
  .detalhe td{max-width:none}

  /*   ESPAÇO QUE SOBRA VIRA INFORMAÇÃO, NÃO COLUNA ESTICADA
   *
   * Com o teto acima, uma tabela de três colunas para de esticar — e
   * deixaria 2400px de fundo vazio numa tela ultrawide, que é a mesma
   * queixa por outro lado. Então os grupos (cada `h2` com o que vem até o
   * próximo) se acomodam LADO A LADO: o espaço livre é preenchido com mais
   * conteúdo, não com uma linha de texto que ninguém consegue ler.
   *
   * `minmax(min(100%,620px),1fr)` é o que impede a coluna de nascer menor
   * que a tela em telas estreitas — sem o `min()`, 620px vira rolagem
   * horizontal no celular.
   */
  section[role=tabpanel]{flex:1;align-self:stretch}
  /*   NEM TODO FILHO DO PAINEL É UMA COLUNA
   *
   * `display:grid` no painel inteiro transforma CADA filho direto em item
   * de grid — inclusive `.cards`, a faixa de resumo, que tem layout
   * próprio. Medido na aba Saúde a 3440px: a faixa virou uma coluna de
   * 764x2122px, esticada na vertical para acompanhar a altura da linha, e
   * os cartões viraram quatro caixas altas e estreitas.
   *
   * `.cards` ocupa a linha inteira, e `align-items:start` impede que um
   * bloco curto seja esticado até a altura do bloco mais alto da linha.
   *
   * 620px era estreito demais: dava 4 colunas de 763px numa tela de 3440,
   * e uma tabela de três colunas nesse espaço volta a espremer a coluna do
   * meio. 900px dá 3 colunas de ~1130px. */
  section[role=tabpanel]:has(> .grupo){
    display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,900px),1fr));
    gap:2px 30px;align-content:safe center;align-items:start;
  }
  /* Qualquer filho direto que NÃO seja um grupo — a faixa de cartões, uma
     nota de contexto, um aviso — ocupa a linha inteira. Só `.grupo` é
     coluna. A primeira versão nomeava só `.cards` e a nota de "lido em"
     da aba nova virou uma coluna vazia de 900px ao lado dela. */
  section[role=tabpanel] > :not(.grupo){grid-column:1/-1}
  /* Visível para leitor de tela, nunca para o olho. `clip-path` em vez de
     `display:none`, que o tiraria da árvore de acessibilidade junto. */
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;
      clip-path:inset(50%);white-space:nowrap}
  .grupo{min-width:0}
  .grupo.largo{grid-column:1/-1}
  /*   RAZÃO ENTRE COLUNAS NÃO É A MEDIDA — LARGURA DE LEITURA É
   *
   * Em "Aprendizados" as quatro primeiras colunas travam em 78px porque é
   * o mínimo do conteúdo delas; só a de texto absorve o resto. Medido com
   * quatro tetos, a razão mal se mexe (16,3x → 10,4x) enquanto a coluna de
   * texto cai de 1275px para 709px. Perseguir a razão seria perseguir um
   * número que o conteúdo curto fixa sozinho.
   *
   * 140ch é onde a coluna de leitura chega a 871px sem espremer a tabela
   * de seis colunas de "Sessões", que divide o mesmo teto. */
  .grupo.largo table{max-width:140ch}

  /*   PÁGINA CURTA NÃO É PÁGINA VAZIA
   *
   * "Pesquisas" ocupava 17% da altura e "Versão instalada" 53%: o conteúdo
   * terminava e sobrava fundo, como se a tela tivesse falhado ao carregar.
   * Quando o conteúdo é curto ele centraliza na vertical — a página fica
   * intencional em vez de interrompida.
   */
  section[role=tabpanel]:not(:has(> .grupo)){
    display:flex;flex-direction:column;gap:14px;justify-content:safe center;
  }
  /*   ESTADO VAZIO DE PÁGINA NÃO É ESTADO VAZIO DE CÉLULA
   *
   * `.na` nasceu para a página sem conteúdo, onde 120px de altura mínima
   * impedem a tela de parecer que falhou ao carregar. Mas a MESMA classe é
   * usada na célula de tabela sem valor — e ali os 120px inflavam CADA
   * linha: medido na aba Saúde, linhas de 133px e 219px para conteúdo de
   * duas linhas de texto, com um travessão solto boiando no meio.
   *
   * Dentro de célula o vazio é só um travessão: a linha tem a altura do
   * que ela contém. */
  .na{
    display:flex;align-items:center;justify-content:center;
    min-height:120px;border:1px dashed var(--line);border-radius:6px;
    color:var(--muted);font-size:13px;
  }
  td .na,td.na{min-height:0;border:0;padding:0;display:block;text-align:center}

/*   MEDIA QUERY ATIVA != MEDIA QUERY APLICADA
 *
 * Estes blocos ficavam ANTES das regras base e perdiam por ORDEM: media
 * query não acrescenta especificidade, então `.hud` declarado depois
 * sobrescrevia `.hud` dentro de `@media`. Medido no navegador a 390px:
 * `matchMedia('(max-width: 720px)').matches` era `true`, a regra `1fr`
 * existia na folha, e o aplicado era `260px 172px 260px` — três colunas
 * cortadas por `overflow-x:hidden` numa caixa de 358px.
 *
 * Quatro seletores estruturais eram anulados assim: .hud, .hud-center,
 * .cards, .note. A responsividade inteira era código morto, e foi reportada
 * como entregue porque só tinha sido olhada a 1470px, onde nenhuma delas
 * dispara.
 *
 * Ficam no FIM do bloco de estilo. Qualquer regra base nova entra ACIMA
 * daqui.
 */
@media (max-width: 1180px){
    .hud{grid-template-columns:1fr 1fr}            /* 3 → 2 colunas */
    .hud-center{grid-column:1 / -1;order:-1;min-height:260px}
    main{padding:16px}
  }
@media (max-width: 720px){
    .hud{grid-template-columns:1fr}                /* 2 → 1 coluna */
    .cards{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
    .card b{font-size:19px}
    header{padding:12px 16px;gap:8px}
    h1{font-size:13px}
    main{padding:14px 16px}
    /* Coluna com piso de largura: só no celular, onde uma coluna
       espremida vira letra por letra em vez de palavra por palavra. */
    td,th{white-space:normal;min-width:110px}
  }
@media (max-width: 480px){
    .cards{grid-template-columns:1fr 1fr}
    nav button{padding:9px 10px;font-size:12px}
    .note{padding:9px 11px}
    /*   ALVO DE 44PX SÓ CUSTA NA LARGURA QUE PRECISA DELE
     *
     * Medido a 390px: `h2.rotulo-hud.ir` (27px), `.kv.ir` (25px) e
     * `tr[data-open]` (35px) ficavam abaixo do mínimo de toque — o mesmo
     * WCAG 2.5.8 que a nav já respeitava. Alvo pequeno passa no mouse de
     * 768/1440 (o brief não cobra alvo lá), então o ajuste fica só aqui:
     * dar altura em telas largas custaria espaço vertical à toa numa
     * tabela densa que ninguém toca com o dedo.
     */
    h2.rotulo-hud.ir{padding-block:13px;margin-block:-13px 3px}
    .kv.ir{padding-block:13px;margin-block:-8px}
    tr[data-open] td{padding-block:13px}
  }
</style>
</head>
<body>
<header>
  <h1>NEXOS</h1>
  <span class="muted mono" id="meta"></span>
  <span class="muted">·</span>
  <a href="graph-view.html">Mapa do código →</a>
</header>
<nav id="tabs" role="tablist"></nav>
<main id="panes"></main>
<script>
const D = /*__PAYLOAD__*/null;
const h = (s) => String(s ?? '').replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
const card = (label, value, cls = '') => `<div class="card"><b class="${cls}">${h(value)}</b><span>${h(label)}</span></div>`;
const cards = (pairs) => `<div class="cards">${pairs.map(([l, v, c]) => card(l, v, c)).join('')}</div>`;
/**
 * Linha de tabela que ABRE detalhe.
 *
 * O painel tinha 390 linhas de tabela e ZERO clicáveis — clicar em um
 * aprendizado, uma tarefa ou uma ferramenta não fazia nada. O dado inteiro já
 * estava na tela e não respondia, o que fazia a tela parecer quebrada em vez
 * de somente-leitura. `data-open` marca o que é clicável, e o CSS avisa com
 * cursor e hover ANTES do clique.
 *
 * O detalhe abre inline (linha extra logo abaixo), não em modal: o contexto
 * da lista continua visível, que é o que importa quando se está comparando
 * itens de uma fila.
 */
const linhaAbrivel = (celulas, detalhe) => {
  const id = `d${linhaAbrivel.n = (linhaAbrivel.n || 0) + 1}`;
  /**
   *   CLICÁVEL != ALCANÇÁVEL
   *
   * Medido no navegador: 286 linhas respondiam ao mouse e NENHUMA ao
   * teclado — `tabindex` ausente tira a linha da ordem de foco, então para
   * quem não usa mouse o painel inteiro era somente-leitura. É a queixa
   * "clico e nada" do dono, permanente.
   *
   * `aria-expanded` no lugar de `role="button"`: a linha continua sendo
   * linha de tabela para o leitor de tela (trocar o papel quebraria a
   * navegação por células), e o estado aberto/fechado é anunciado.
   */
  /**
   *   ARIA VÁLIDO DEPENDE DO PAPEL DO PAI
   *
   * `aria-expanded` numa `<tr>` é atributo PROIBIDO: só vale em linha de
   * `treegrid`, e declarar `treegrid` sem implementar navegação por setas
   * seria outra promessa que o DOM não cumpre. Medido pelo Lighthouse, que
   * reprovou 297 linhas de uma vez.
   *
   * O estado vai no `aria-label`, que é válido em qualquer elemento e é
   * atualizado no toggle — o leitor de tela continua sabendo se abriu.
   */
  return `<tr data-open="${id}" tabindex="0" aria-controls="${id}" aria-label="ver detalhe">${celulas}</tr>`
    + `<tr id="${id}" hidden><td colspan="9"><div class="detalhe">${detalhe}</div></td></tr>`;
};

/** Pares rótulo/valor do detalhe. Valor ausente vira "—", nunca vazio mudo. */
const dl = (pares) => `<dl>${pares.filter(([, v]) => v !== undefined)
  .map(([k, v]) => `<dt>${h(k)}</dt><dd>${v === null || v === '' ? '—' : h(String(v))}</dd>`).join('')}</dl>`;

/**
 *   NÚMERO NA TELA É PERGUNTA, NÃO RESPOSTA
 *
 * Todo rótulo e todo número do HUD que tem uma aba correspondente vira
 * navegação: quem lê "626 ferramentas" quer VER as 626. Sem isso a tela é
 * um cartaz — mostra o dado e não deixa chegar nele.
 *
 * `data-goto` é o par de `data-open` (que abre detalhe inline): um navega
 * entre abas, o outro expande no lugar. Os dois com delegação, teclado e
 * foco visível.
 */
/**
 *   O NOME ACESSÍVEL PRECISA CONTER O TEXTO VISÍVEL
 *
 * `aria-label="abrir Saúde"` num elemento que mostra "Projeto" reprova
 * `label-content-name-mismatch`: quem usa comando de voz fala o que VÊ, e o
 * nome acessível tem que começar por isso. Medido: 15 elementos de uma vez.
 */
/**
 *   ATRIBUTO DUPLICADO É SILENCIOSO
 *
 * A primeira versão colava `class="ir"` ao lado de um `class=` que o
 * elemento já tinha. O navegador fica com o PRIMEIRO e descarta o segundo
 * sem erro nenhum: a navegação funcionava, o estilo de clicável não
 * aparecia, e nada no console avisava. `extra` entra na MESMA lista.
 */
/**
 *   NOME ACESSÍVEL MONTADO À MÃO ERRA O ESPAÇO QUE O DOM NÃO TEM
 *
 * A correção anterior montava `aria-label="estado CANONICAL, abrir Saúde"`.
 * Reprovou de novo, em 11 elementos: o texto VISÍVEL são dois `span`
 * colados no HTML, que o leitor concatena como `estadoCANONICAL` — e
 * `estadoCANONICAL` não está contido em `estado CANONICAL`. O espaço
 * existia na string e não no DOM.
 *
 * Um `aria-label` escrito à mão sempre vai poder divergir do que a tela
 * mostra. Então não há mais `aria-label`: o destino entra como texto
 * oculto DENTRO do elemento, e o nome acessível passa a ser o próprio
 * texto visível mais o sufixo. Não tem como divergir do que não é
 * duplicado.
 */
const irPara = (aba, extra = '') =>
  `class="ir${extra ? ' ' + extra : ''}" data-goto="${h(aba)}" tabindex="0" role="link"`;
/** Sufixo lido, nunca visto: diz para onde o elemento leva. */
const sr = (aba) => `<span class="sr">, abrir ${h(aba)}</span>`;
/**
 *   RÓTULO E DADOS PRECISAM SER UM ELEMENTO SÓ
 *
 * Enquanto título e pares eram IRMÃOS soltos na coluna, qualquer tentativa
 * de distribuí-los em grid quebrava a associação: o grid preenche célula a
 * célula e "Instalação" acabou exibindo `ramo`, "Não medimos ainda"
 * exibindo `commit`. Dado sob rótulo errado é pior que layout feio — é
 * afirmação falsa na tela.
 *
 * `bloco()` fecha cada seção num contêiner. Aí o grid distribui BLOCOS, e o
 * que está dentro nunca se separa do seu título.
 */
const bloco = (titulo, aba, itens) => `<div class="bloco">${secao(titulo, aba)}${itens}</div>`;

/** Rótulo do HUD é seção de primeiro nível do painel: `h2`, não `h4` — h1 -> h4 é salto de três níveis. */
const secao = (titulo, aba) =>
  aba
    ? `<h2 ${irPara(aba, 'rotulo-hud')}>${h(titulo)}${sr(aba)}</h2>`
    : `<h2 class="rotulo-hud">${h(titulo)}</h2>`;
const kv = (l, v, aba) =>
  aba
    ? `<div ${irPara(aba, 'kv')}><span class="lbl">${h(l)}</span><b>${h(v)}</b>${sr(aba)}</div>`
    : `<div class="kv"><span class="lbl">${h(l)}</span><b>${h(v)}</b></div>`;

/**
 *   RÓTULO E NÚMERO NO MESMO PESO NÃO É PAINEL, É LISTA
 *
 * O que o olho procura num instrumento é a GRANDEZA: o rótulo diz o que é, o
 * número diz quanto. Lado a lado no mesmo tamanho, os dois competem e nenhum
 * ganha — o painel vira texto corrido e é preciso LER para saber o estado.
 *
 * `metrica` inverte: rótulo pequeno em cima, número grande embaixo. E quando
 * o valor é uma fração ("2/4", "117/117"), desenha a proporção — barra cheia
 * é bom, barra pela metade se vê de longe sem ler número nenhum.
 */
const metrica = (l, v, aba, nota) => {
  const txt = String(v);
  const frac = txt.match(/^(\d+)\s*\/\s*(\d+)$/);
  const pct = frac ? Math.round((Number(frac[1]) / Math.max(1, Number(frac[2]))) * 100) : null;
  const corpo =
    `<span class="lbl">${h(l)}</span>` +
    `<span class="num">${h(frac ? frac[1] : txt)}${frac ? `<i>/${h(frac[2])}</i>` : ''}</span>` +
    (nota ? `<span class="nota">${h(nota)}</span>` : '') +
    (pct === null
      ? ''
      : `<span class="barra"><i style="width:${pct}%"></i></span>`);
  return aba
    ? `<div ${irPara(aba, 'metrica')}>${corpo}${sr(aba)}</div>`
    : `<div class="metrica">${corpo}</div>`;
};

/**
 *   UM TÍTULO E O QUE ELE EXPLICA SÃO UMA COISA SÓ
 *
 * As abas internas são uma sequência plana de `h2` e tabela irmãos. Plana,
 * elas só empilham: em 3440px sobra metade da tela vazia à direita e cada
 * tabela estica para tapar o buraco.
 *
 * Aqui cada `h2` e o que vem até o próximo `h2` entram num `.grupo`, que é
 * o que o grid acomoda lado a lado. Sem esse passo o grid separaria título
 * de tabela em colunas diferentes — o defeito que `bloco()` já tinha
 * resolvido na visão geral, pelo mesmo motivo.
 *
 * Tabela com mais de quatro colunas leva `largo` e fica em linha inteira:
 * espremer uma tabela larga em meia tela só troca o problema por rolagem
 * horizontal.
 */
const agrupar = (sec) => {
  if (!sec.querySelector(':scope > h2')) return;
  let g = null;
  for (const el of [...sec.children]) {
    if (el.tagName === 'H2') {
      g = document.createElement('div');
      g.className = 'grupo';
      sec.insertBefore(g, el);
    }
    if (!g) continue;
    g.appendChild(el);
    if (el.querySelectorAll('thead th').length > 4) g.classList.add('largo');
  }
};

/**
 *   NOME INTERNO NÃO É NOME DE TELA
 *
 * O Store guarda `SUCCEEDED`, `HUMAN_REQUIRED`, `VERIFYING` — e continua
 * guardando, é o vocabulário canônico dele. A tela é lida por quem quer
 * saber em que pé está o trabalho, não por quem conhece a máquina de
 * estados.
 *
 * Antes havia DOIS dicionários parciais, ambos com os mesmos três estados,
 * escritos inline em lugares diferentes. Os outros cinco passavam crus por
 * falta de entrada: dicionário incompleto não avisa que está incompleto.
 *
 * `_TAREFA` no nome não é enfeite. A primeira versão chamou isto de
 * `ESTADO` e o guard de idempotência do patch — `'const ESTADO = {' not in
 * s` — casou com o `ESTADO` LOCAL da Visão geral, que é outra coisa (o
 * estado do trabalho resolvido pelo boot). O dicionário nunca foi inserido,
 * e o gate de execução do build barrou com `ESTADO is not defined`:
 *
 *     GUARD DE IDEMPOTÊNCIA QUE CASA COM OUTRA COISA NÃO É GUARD
 *
 * O nome cru acompanha em cinza onde cabe: quem cruzar a tela com a saída
 * de `nexos checkpoint` precisa dos dois.
 */
/**
 * Estados de PROJETO — identidade da capsule e saúde do doctor. Família
 * diferente da de tarefa, e o dicionário é separado de propósito: `BLOCKED`
 * existe nas duas e quer dizer coisas diferentes (aqui, identidade em
 * conflito; lá, tarefa que não pode seguir). Um dicionário só traduziria
 * um dos dois errado, em silêncio.
 */
const ESTADO_PROJETO = {
  CANONICAL: 'identidade confirmada',
  NOT_ADOPTED: 'ainda não adotado',
  NO_PROJECT: 'sem projeto nesta pasta',
  BLOCKED: 'identidade em conflito',
  HEALTHY: 'em ordem',
  DRIFTED: 'fora de sincronia',
  PARTIAL: 'instalação incompleta',
  LEGACY: 'em formato antigo',
  CONFLICT: 'em conflito',
  CORRUPT: 'arquivo danificado',
  UNSUPPORTED: 'versão não suportada',
  DEGRADED: 'funcionando com limitação',
};

const ESTADO_TAREFA = {
  PENDING: 'na fila',
  READY: 'pronta para começar',
  RUNNING: 'em andamento',
  VERIFYING: 'em conferência',
  SUCCEEDED: 'concluída',
  FAILED: 'falhou',
  HUMAN_REQUIRED: 'esperando você',
  BLOCKED: 'travada',
  SUPERSEDED: 'substituída',
};

const table = (cols, rows, scroll = rows.length > 25) => rows.length
  ? `<div class="${scroll ? 'scroll' : ''}"><table><thead><tr>${cols.map((c) => `<th>${h(c)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`
  : '<div class="na">nenhum</div>';

/**
 *   20 LINHAS DE CADA VEZ, NÃO A TABELA INTEIRA DE UMA TACADA
 *
 * "Estrutura do código" media 5035px de altura a 390px com uma tabela só de
 * 40 linhas. `table()` já corta tabela de mais de 25 linhas num `.scroll`
 * que rola DENTRO da própria caixa — mas a altura ocupada na PÁGINA
 * continua a mesma, porque as 40 linhas seguem no DOM. Paginar de verdade
 * tira do DOM o que não está na página atual.
 *
 * Estado num registro global por id, não em closure: a aba inteira é
 * recriada a cada troca (`sec.innerHTML = panes[name]()`) — uma closure
 * morreria junto, e a delegação de clique (`document.addEventListener`)
 * precisa achar o estado de novo em qualquer clique futuro, mesmo depois
 * de repintar a aba.
 */
window.__paginas = window.__paginas || {};
let __paginaSeq = 0;
const renderPagina = (id) => {
  const p = window.__paginas[id];
  const totalPaginas = Math.max(1, Math.ceil(p.linhas.length / p.porPagina));
  const inicio = p.atual * p.porPagina;
  const fatia = p.linhas.slice(inicio, inicio + p.porPagina);
  /* `scroll:true` sempre: paginar tira linha do DOM (bom pra contagem e
     teclado), mas 20 linhas ainda podem passar da tela — o teto de
     altura do `.scroll` é quem garante isso, página por página. */
  return `<div id="${id}">${table(p.cols, fatia, true)}`
    + `<div class="paginacao">`
    + `<button data-pagina="${id}" data-dir="-1" ${p.atual === 0 ? 'disabled' : ''}>‹ anterior</button>`
    + `<span class="muted">página ${p.atual + 1} de ${totalPaginas} — ${p.linhas.length} ao todo</span>`
    + `<button data-pagina="${id}" data-dir="1" ${p.atual >= totalPaginas - 1 ? 'disabled' : ''}>próxima ›</button>`
    + `</div></div>`;
};
/** Só pagina o que passa do tamanho da página — abaixo disso é `table()` puro, sem controle à toa. */
const paginar = (cols, linhas, porPagina = 20) => {
  if (linhas.length <= porPagina) return table(cols, linhas);
  const id = `pag${++__paginaSeq}`;
  window.__paginas[id] = { cols, linhas, porPagina, atual: 0 };
  return renderPagina(id);
};

document.getElementById('meta').textContent = `${D.root} · coletado ${D.collectedAt}`;

/**
 *   NAV NÃO PODE ADIVINHAR A ALTURA DO CABEÇALHO
 *
 * `nav` gruda no topo com `position:sticky;top:<altura do header>` — mas o
 * cabeçalho quebra linha (`flex-wrap:wrap`) quando o caminho do projeto é
 * longo numa tela estreita, e um número fixo no CSS acerta uma largura e
 * sobrepõe o cabeçalho em outra. `getBoundingClientRect().height` lê a
 * altura REAL depois do layout, então a barra sempre encosta embaixo do
 * cabeçalho, tenha ele uma linha ou duas. Roda no load e em todo resize —
 * é a mesma condição que muda o número de linhas do cabeçalho.
 */
const sincronizarTopoNav = () => {
  const cabecalho = document.querySelector('header');
  const nav = document.getElementById('tabs');
  if (!cabecalho || !nav) return;
  nav.style.top = `${Math.round(cabecalho.getBoundingClientRect().height)}px`;
};
sincronizarTopoNav();
window.addEventListener('resize', sincronizarTopoNav);

const SEV = ['ok', 'muted', 'drift', 'blocked', 'unknown'];

const cardsLegado = (M) => '<h2>Quem propos (contagem por arquivo, inclui histórico)</h2>'
  + table(['de onde veio', 'quantos'], Object.entries(M.byProposer).map(([p, n]) => `<tr><td class="muted">${h(p)}</td><td class="mono">${n}</td></tr>`));

const panes = {
  'Visão geral': () => {
    const B = D.boot ?? {}, C = D.checkpoints, M = D.memory, K = D.capabilities, R = D.release, S = D.sessions;

    // ESTADO DO TRABALHO — é o que o orbe representa. Vem do boot resolvido,

      COMPLETE: { txt: 'concluído', sub: 'o ciclo atual fechou', cor: 'var(--primary)' },
      HUMAN_DECISION_REQUIRED: { txt: 'esperando você', sub: 'o sistema parou porque a decisão é humana', cor: 'var(--warning)' },
      BLOCKED: { txt: 'bloqueado', sub: 'algo impede o trabalho de seguir', cor: 'var(--danger)' },
    }[B.workState] ?? { txt: 'não sabido', sub: 'o estado do trabalho não pôde ser lido', cor: 'var(--info)' };

    window.__orb = { cor: ESTADO.cor, estado: B.workState ?? 'UNKNOWN' };
    const pendentes = [];
    if ((M.canonical?.stats?.total ?? 0) > 0)
      pendentes.push(['req', `${M.canonical.stats.total} aprendizados esperam sua decisão — o mais antigo há ${M.canonical.stats.oldestDays} dias`, 'Aprendizados']);
    // Pendência vem do HEAD da linhagem, nunca do histórico: record superado
    // com estado BLOCKED descreve o passado daquela cadeia, não o agora.
    if ((C.byStateHead?.BLOCKED ?? 0) > 0)
      pendentes.push(['blk', `${C.byStateHead.BLOCKED} trabalho bloqueado agora`, 'Trabalho feito']);
    if ((C.byStateHead?.HUMAN_REQUIRED ?? 0) > 0)
      pendentes.push(['req', `${C.byStateHead.HUMAN_REQUIRED} trabalho aguardando decisão sua`, 'Trabalho feito']);
    if (!R.healthy)
      pendentes.push(['req', `instalação desalinhada: ${R.stats.outOfSync} de ${R.stats.total} partes fora de dia`, 'Versão instalada']);
    if ((S.stats?.sharedCheckouts ?? 0) > 0)
      pendentes.push(['req', `${S.stats.sharedCheckouts} pasta com mais de uma sessão aberta ao mesmo tempo`, 'Sessões']);
    if (D.research?.stats?.invisibleByLineage > 0)
      pendentes.push(['req', `${D.research.stats.invisibleByLineage} pesquisas gravadas que o sistema não consegue abrir`, 'Pesquisas']);
    if (!pendentes.length) pendentes.push(['', 'nada exige decisão humana agora']);

    return `<div class="hud">
      <div class="col">
        ${bloco('Precisa de você', null, pendentes.map(([c, t, aba]) => {
          const m = String(t).match(/^(\d+)\s+(.*)$/);
          const corpo = m ? `<b class="qtd">${h(m[1])}</b> <span>${h(m[2])}</span>` : `<span>${h(t)}</span>`;
          return aba
            ? `<div class="${c} ir alerta" data-goto="${h(aba)}" tabindex="0" role="link" aria-label="${h(t)}, abrir ${h(aba)}">${corpo}</div>`
            : `<div class="${c} alerta">${corpo}</div>`;
        }).join(''))}
        ${bloco('Projeto', 'Saúde',
            kv('estado', B.state ? (ESTADO_PROJETO[B.state] ?? B.state) : '—', 'Saúde')
          + kv('ramo', B.git?.branch ?? '—')
          + kv('commit', (B.git?.headShort ?? '—'))
          + metrica('arquivos alterados', B.git?.dirtyCount ?? '—'))}
        ${bloco('Instalação', 'Versão instalada',
            metrica('partes em dia', `${R.stats.inSync}/${R.stats.total}`, 'Versão instalada')
          + kv('mais atrasada', R.stats.worstDistance + ' commits', 'Versão instalada'))}
        ${(() => {
          /**
           *   A PRIMEIRA TELA PRECISA DIZER O QUE ACONTECEU
           *
           * Teste real: um experimento foi reprovado por gate, revertido e
           * registrado como decisão — e a visão geral não mencionava nada
           * disso. Mostrava estado, ramo, commit e instalação: o que o
           * projeto É, nunca o que aconteceu com ele.
           *
           * As últimas decisões respondem isso com o dado que já existe.
           * Cada uma leva à aba onde o corpo está.
           */
          const U = D.decisions?.ultimas ?? [];
          if (!U.length) return '';
          const quando = (n) => (n === 0 ? 'hoje' : n === 1 ? 'ontem' : `há ${n} dias`);
          /*
           * O título de uma decisão no Store é um slug
           * (`b-availability-abstention-v1-failed`) — identificador, não
           * frase. Quem lê a primeira tela quer saber O QUE foi decidido,
           * e isso está no corpo. Então a linha principal é a primeira
           * frase do resumo, e o slug fica embaixo em cinza, para quem for
           * cruzar com `nexos decision`. Mesmo padrão dos estados
           * traduzidos: o legível na frente, o interno ao lado.
           */
          const primeiraFrase = (txt) => {
            if (!txt) return null;
            const f = String(txt).split(/(?<=[.!?])\s/)[0].trim();
            return f.length > 150 ? f.slice(0, 147) + '…' : f;
          };
          return bloco('Decidido por último', 'Decisões', U.slice(0, 4).map((u) => {
            const frase = primeiraFrase(u.resumo);
            return `
            <div class="kv" style="display:block;padding:6px 0">

              <div class="muted mono" style="margin-top:2px">${h(u.titulo)} · ${h(quando(u.diasAtras))}</div>
            </div>`;
          }).join(''));
        })()}
        ${bloco('Não medimos ainda', null,
            '<div class="gap">contexto consumido</div>'
          + '<div class="gap">latência de voz</div>'
          + '<div class="gap">artefatos gerados</div>')}
      </div>

      <div class="hud-center">
        <canvas id="orb"></canvas>
        <div class="orb-state">${h(ESTADO.txt)}</div>
        <div class="orb-name">NEXOS</div>
        <div class="orb-sub">${h(ESTADO.sub)}</div>
      </div>

      <div class="col">
        ${bloco('Trabalho', 'Trabalho feito',
            metrica('tarefas registradas', C.stats.total, 'Trabalho feito')
          + metrica('encerradas', C.stats.terminals, 'Trabalho feito')
          + metrica('com prova localizável', `${C.reach.reachable}/${C.reach.terminals}`, 'Provas'))}
        ${bloco('Ferramentas', 'Ferramentas',
            /*
             *   O MESMO DEFEITO MORAVA EM DOIS LUGARES
             *
             * A aba Ferramentas foi corrigida — "645 disponíveis" com 483
             * desligadas — e este bloco da primeira tela continuou
             * anunciando o catálogo inteiro. Corrigir onde o defeito foi
             * MEDIDO não é corrigir o defeito: é preciso procurar o mesmo
             * número em todo lugar que ele aparece.
             *
             * A fração mostra os dois números de uma vez: `162/645` diz
             * mais que qualquer um deles sozinho, e a barra de proporção
             * que `metrica()` já desenha torna o 25% visível sem texto.
             */
            metrica('prontas para usar', K.stats.ativas != null ? `${K.stats.ativas}/${K.stats.total}` : K.stats.total, 'Ferramentas')
          + (K.stats.desligadas ? metrica('desligadas', K.stats.desligadas, 'Ferramentas', 'existem no disco e não respondem') : '')
          + metrica('que não lemos', K.stats.unreadableByOurScanner, 'Ferramentas'))}
        ${bloco('Sessões', 'Sessões',
            metrica('abertas', S.stats?.active ?? '—', 'Sessões')
          + metrica('registradas', S.stats?.total ?? '—', 'Sessões'))}
      </div>
    </div>
    <div class="mission" hidden>
      <h2 style="margin-top:0">Precisa de você</h2>
      ${pendentes.map(([c, t, aba]) => {
        /** O número que abre a frase vira a grandeza; o resto é a explicação. */
        const m = String(t).match(/^(\d+)\s+(.*)$/);
        const corpo = m ? `<b class="qtd">${h(m[1])}</b> <span>${h(m[2])}</span>` : `<span>${h(t)}</span>`;
        return aba
          ? `<div class="${c} ir alerta" data-goto="${h(aba)}" tabindex="0" role="link" aria-label="${h(t)}, abrir ${h(aba)}">${corpo}</div>`
          : `<div class="${c} alerta">${corpo}</div>`;
      }).join('')}
    </div>
    `;
  },

  'Versão instalada': () => {
    const R = D.release;
    const cls = { MATCH: 'ok', BEHIND: 'blocked', DIVERGED: 'blocked', UNKNOWN: 'unknown' };
    const nomePt = {

    return cards([

    + (R.healthy ? '' : `<div class="note"><b>O programa que está rodando não é o que foi escrito.</b>

        <br><br>Quando a versão em uso fica para trás, tudo que foi feito depois dela existe no projeto e <b>não chega até você</b>.
