    + '<h2>As quatro partes do sistema</h2>'
    + table(['elo', 'valor', 'situação', 'distância', 'nota'], R.links.map((l) => `<tr>
        <td>${h(nomePt[l.name] ?? l.name)}<div class="mono muted">${h(l.name)}</div></td>
        <td class="mono">${l.observed ? h(String(l.value).slice(0, 12)) : '<span class="na">não observado</span>'}</td>
        <td><span class="tag ${cls[l.state]}">${l.state === 'UNKNOWN' ? '?' : h(estadoPt[l.state] ?? l.state)}</span></td>
        <td class="mono ${(l.distance ?? 0) > 0 ? 'blocked' : ''}">${h(l.distanceLabel)}</td>
        <td class="muted">${h(l.note ?? '')}</td></tr>`))
    + (R.healthy ? '<div class="note" style="border-left-color:var(--primary)">Tudo alinhado: o que roda é o que foi escrito.</div>' : `<div class="note"><b>Como consertar — é um comando só, e quem roda é você.</b> ${h(R.remedy.what)}:
       <br><span class="mono">${h(R.remedy.command)}</span>
       <br><span class="muted">${h(R.remedy.whose)}</span></div>`);
  },

  'Saúde': () => {
    const H = D.health;
    if (H.unavailable) return `<div class="note"><b>INDISPONÍVEL</b> — ${h(H.unavailable)}<br><span class="muted">Não conseguimos ler esta informação agora. Isso é um fato a mostrar, não uma tela em branco.</span></div>`;
    const B = D.boot ?? {};
    const WS = { CONTINUE: 'ok', COMPLETE: 'ok', HUMAN_DECISION_REQUIRED: 'drift', BLOCKED: 'blocked' };
    return cards([
      ['situação', ESTADO_PROJETO[H.state] ?? H.state, SEV[H.severity]],
      ['o que fazer agora', B.workState ?? '—', WS[B.workState] ?? 'unknown'],
      ['branch', B.git?.branch ?? '—'],
      ['arquivos alterados', B.git?.dirtyCount ?? '—', B.git?.dirtyCount ? 'drift' : ''],
      ['áreas checadas', H.stats.areas], ['sugestões', H.stats.planItems],
      ['com comando pronto', H.stats.actionable], ['só aviso, sem ação', H.advisoryOnly.length],
    ])
    + (H.known ? '' : '<div class="note">Situação que o sistema não reconhece. Tratada como <b>desconhecida</b>, nunca como saudável — "não sabemos" não é "está tudo bem".</div>')
    + '<h2>Por que está assim</h2>' + (H.reasons.length ? `<ul class="muted">${H.reasons.map((r) => `<li>${h(r)}</li>`).join('')}</ul>` : '<div class="na">sem motivo declarado</div>')
    + '<h2>O que foi checado</h2>' + table(['área', 'evidência', 'sugestões'], H.areas.map((a) => `<tr>
        <td class="mono">${h(a.area)}</td>
        <td class="muted">${a.evidence.map(h).join('<br>') || '<span class="na">—</span>'}</td>
        <td class="prosa">${a.plan.map((p) => `<span class="tag ${p.actionable ? 'drift' : 'muted'}">${h(p.action)}</span> ${h(p.detail)}${p.command ? `<div class="mono muted">${h(p.command)}</div>` : '<div class="na">sem comando — aviso, não tarefa</div>'}`).join('<br>') || '<span class="na">—</span>'}</td></tr>`))
    + '<h2>O que esta tela ainda não sabe dizer</h2>'
    + Object.entries(H.gaps).map(([k, v]) => `<div class="note"><b>${h(k)}</b> — ${h(v)}</div>`).join('');
  },

  /**
   *   ANÁLISE QUE NINGUÉM LÊ NÃO É ANÁLISE
   *
   * O graphify roda por hook a cada commit e escreve em `graphify-out/`
   * desde 2026-09-16. Ele já calculava quais peças concentram ligação
   * demais, quais ligações surpreendem e quais perguntas o grafo levanta —
   * e nada disso chegava a lugar nenhum. Seis dias de análise diária lidos
   * por ninguém.
   *
   * Esta aba NÃO desenha grafo: o mapa já faz isso, e melhor. Aqui vai o
   * que a análise CONCLUIU, em tabela, com o arquivo e a linha de cada
   * peça — porque "forProject() tem 35 ligações" só vira decisão quando
   * vem com "e mora em src/lib/capsule/paths.ts:109".
   */
  'Estrutura do código': () => {
    const G = D.graphify ?? {};
    if (!G.medido) {
      return '<h2>Estrutura do código</h2>'
        + `<div class="note"><b>Ainda não medimos.</b> ${h(G.motivo ?? 'a análise não está disponível')}<br>`
        + '<span class="muted">Esta tela lê o que a ferramenta já escreveu — ela nunca roda análise sozinha.</span></div>';
    }
    const T = G.totais;
    const pct = (n) => (n === null || n === undefined ? '—' : (n * 100).toFixed(1) + '%');

    const quando = (d) => (d === 0 ? 'hoje' : d === 1 ? 'ontem' : d != null ? `há ${d} dias` : 'data desconhecida');
    /**
     *   DUAS PROCEDÊNCIAS NUNCA VIRAM UMA DATA SÓ
     *
     * Medido por verificação independente: `.graphify_analysis.json` tem
     * hash IDÊNTICO nas seis pastas diárias, com mtime de 15/08, enquanto
     * `graph.json` muda todo dia. A ferramenta regenera o grafo e copia a
     * análise antiga para dentro da pasta nova. Mostrar "hoje" para as duas
     * é o erro que esta tela cometeu uma vez.
     */
    const velha = G.coerencia?.mesmaExecucao === false || (G.defasagemDias ?? 0) > 2;
    /** Marca visível nas seções que vêm da análise, não do mapa de hoje. */
    const seloAnalise = velha ? ` <span class="tag drift">análise de ${h(G.analise.em ?? '?')}</span>` : '';

    return cards([
      ['peças no código', T.simbolos],
      ['ligações entre elas', T.ligacoes],
      ['funções e métodos', T.chamaveis, 'muted'],
      ['grupos', T.grupos],
      ['sem nenhuma ligação', T.semLigacao, T.semLigacao ? 'unknown' : ''],
      ['perguntas em aberto', T.perguntas, T.perguntas ? 'drift' : ''],
    ])
    + `<div class="muted" style="margin-bottom:10px">Contagem e ligações vêm do mapa de <b>${h(G.grafo.em ?? G.pasta)}</b> (${quando(G.grafo.diasAtras)}), refeito a cada commit.</div>`
    + (velha
        ? `<div class="note"><b>A análise não acompanha o mapa.</b> O mapa é de ${h(G.grafo.em ?? '?')} e a análise é de <b>${h(G.analise.em ?? 'data desconhecida')}</b>`
          + `${G.defasagemDias != null ? ` — ${G.defasagemDias} dias de diferença` : ''}. `
          + `${G.coerencia?.idsConferidos ? `Nenhum dos ${G.coerencia.idsConferidos} identificadores da análise existe no mapa de hoje (${G.coerencia.idsQueCruzam} de ${G.coerencia.idsConferidos}), que é a prova de que saíram de execuções diferentes da ferramenta. ` : ''}`
          + 'A ferramenta regenera o mapa todo dia e copia a análise antiga para a pasta nova.<br>'
          + '<span class="muted">O que dá para contar no mapa de hoje — peças, ligações, grupos — está atualizado. '
          + 'O que só a análise calcula — surpresas, perguntas, coesão — está marcado abaixo com a data dela.</span></div>'
        : '')

    + (T.semLigacao
        ? `<div class="muted" style="margin-bottom:10px"><b>${T.semLigacao}</b> peças aparecem sem nenhuma ligação no mapa. `
          + 'Isso <b>não</b> quer dizer código morto: o leitor não enxerga chamada por subprocesso, por string ou por configuração, '
          + 'e uma auditoria anterior neste projeto classificou 8.041 linhas vivas como órfãs exatamente por ler este número como veredito.</div>'
        : '')
    + '<h2>Peças que muita coisa usa</h2>'
    + '<div class="muted">Quanto mais coisas dependem de uma peça, mais caro fica mudá-la — e mais gente quebra quando ela quebra. '
    + 'Não é defeito por si: é onde olhar primeiro antes de mexer. Clique numa linha para ver onde ela mora.</div>'
    + (T.localizados < T.concentradores
        ? `<div class="muted" style="margin:4px 0 6px"><b>${T.concentradores - T.localizados}</b> de ${T.concentradores} não puderam ser localizadas no arquivo.</div>`
        : '')
    + paginar(['peça', 'o que é', 'quantas a usam', 'onde mora'], G.concentradores.map((c) => linhaAbrivel(
        `<td class="mono">${h(c.rotulo)}</td>
         <td class="muted">${h(c.tipo ?? '—')}</td>
         <td class="mono">${c.ligacoes}</td>
         <td class="mono muted">${c.onde ? h(c.onde) : '<i>não localizada</i>'}</td>`,
        dl([
          ['peça', c.rotulo],
          ['o que é', c.tipo],
          ['quantas outras peças a usam', c.ligacoes],
          ['arquivo e linha', c.onde],
          ['grupo a que pertence', c.grupo],
          ['o que isso significa', 'mudar esta peça alcança ' + c.ligacoes + ' outras. Antes de alterar a assinatura dela, vale ver quem chama.'],
        ])
      )))

    + `<h2>Ligações que surpreendem${seloAnalise}</h2>`
    + `<div class="muted">Chamadas que cruzam fronteiras que normalmente não se cruzam${G.inesperadas[0]?.porque ? `: ${h(G.inesperadas[0].porque)}` : ''}. Pode ser atalho que virou dívida, ou pode ser intencional — a tela aponta, não julga.</div>`
    /* A coluna "por quê" era a MESMA frase nas cinco linhas — não distinguia
       nada. O que distingue é quais arquivos se tocam; o motivo comum vai
       uma vez no texto acima e o detalhe de cada uma fica no clique. */
    + paginar(['de', 'para', 'atravessa'], G.inesperadas.map((x) => linhaAbrivel(
        `<td class="mono">${h(x.de)}</td>
         <td class="mono">${h(x.para)}</td>
         <td class="mono muted">${h(x.arquivos.join('  →  ') || '—')}</td>`,
        dl([
          ['de', x.de],
          ['para', x.para],
          ['tipo de ligação', x.relacao],
          ['arquivos', x.arquivos.join('  →  ')],
          ['grau de certeza', x.certeza === 'EXTRACTED' ? 'lido do código (EXTRACTED)' : x.certeza === 'INFERRED' ? 'hipótese da ferramenta (INFERRED)' : x.certeza],
          ['por que chamou atenção', x.porque],
        ])
      )))

    + `<h2>Perguntas que a análise levanta${seloAnalise}</h2>`
    + '<div class="muted">A ferramenta não responde nenhuma delas. São pontos onde a estrutura pede explicação — e a explicação pode ser "está certo assim".</div>'
    /**
     *   PROSA EM CÉLULA DE TABELA VIRA UMA COLUNA GIGANTE
     *
     * Medido a 390px: essa tabela de 2 colunas ("tipo"/"pergunta") tinha
     * 2428px de altura pra 7 linhas — a coluna de pergunta é frase inteira
     * mais o "porque", e uma célula não tem teto de largura próprio
     * (`max-width` em `td` não existe pra `table-layout:auto`, já provado
     * noutro comentário deste arquivo). Bloco empilhado em vez de linha de
     * tabela: cada pergunta vira um cartão de largura inteira, que é onde
     * prosa lê melhor — e a lista toda cabe num teto de altura próprio.
     */
    + (G.perguntas.length
        ? `<div class="lista-perguntas">${G.perguntas.map((q) => `<div class="item-pergunta">`
            + `<span class="tag">${h(q.tipoPt ?? q.tipo ?? '?')}</span>${q.tipoPt ? ` <span class="mono muted">${h(q.tipo)}</span>` : ''}`
            + `<p>${h(q.pergunta)}</p>`
            + (q.porque ? `<div class="muted">${h(q.porque)}</div>` : '')
            + `</div>`).join('')}</div>`
        : '<div class="na">nenhuma</div>')

    + `<h2>Grupos do código${G.comunidadesOmitidas ? ` (${G.comunidades.length} maiores de ${G.comunidades.length + G.comunidadesOmitidas})` : ''}</h2>`
    + '<div class="muted">A ferramenta agrupa o que anda junto. <b>Coesão</b> é o quanto as peças do grupo se usam entre si: '
    + 'baixa num grupo pequeno é normal, baixa num grupo grande costuma dizer que ali dentro há mais de um assunto.</div>'
    + (velha
        ? '<div class="muted" style="margin-bottom:4px">A coesão fica de fora enquanto a análise não acompanhar o mapa: '
          + 'casar um tamanho de hoje com uma coesão de outra execução produz uma linha que parece certa e não é.</div>'
        : '')
    + paginar(velha ? ['grupo', 'peças'] : ['grupo', 'peças', 'coesão'], G.comunidades.map((c) => `<tr>
        <td>${h(c.nome)}</td>
        <td class="mono">${c.tamanho}</td>
        ${velha ? '' : `<td class="mono ${c.coesao !== null && c.coesao < 0.1 && c.tamanho >= 20 ? 'drift' : ''}">${pct(c.coesao)}</td>`}</tr>`));
  },

  'Trabalho feito': () => {
    const C = D.checkpoints;
    const gap = Object.entries(C.reasonGap);
    return cards([
      ['total', C.stats.total], ['tarefas encerradas', C.stats.terminals],
      ['sem motivo anotado', C.stats.terminalsWithoutReason, 'drift'],
      ['com prova localizável', C.reach.reachable + '/' + C.reach.terminals, C.reach.unreachable ? 'blocked' : 'ok'],
      ['sem prova nenhuma', C.reach.trulyUnprovable, C.reach.trulyUnprovable ? 'blocked' : 'ok'],
      ['linhas de trabalho', C.stats.heads], ['ligações quebradas', C.stats.danglingLinks, C.stats.danglingLinks ? 'blocked' : ''],
    ])
    + `<div class="note"><b>Falta a anotação, mas a prova existe.</b>
       Em ${C.stats.terminalsWithoutReason} de ${C.reach.terminals} tarefas encerradas ninguém escreveu ali mesmo o motivo do encerramento.
       Parece grave e não é: a prova do que aconteceu fica guardada no passo anterior, o momento em que o trabalho foi conferido.
       <br><br><b>${C.reach.reachable} de ${C.reach.terminals}</b> tarefas têm prova localizável, quase sempre a <b>um passo</b> de distância
       (${(C.reach.hops['1'] ?? 0)} delas). O número que daria preocupação real é o de tarefas sem prova nenhuma:
       <b>${C.reach.trulyUnprovable}</b>. O custo aqui é ter que procurar, não ter perdido.</div>`
    + '<h2>Tarefas sem motivo anotado, por tipo de encerramento</h2>'
    + '<div class="muted">Onde a anotação falta, a prova está um passo atrás. Dá trabalho achar, mas não se perdeu.</div>'
    + table(['situação', 'total', 'sem o campo', ''], gap.map(([st, g]) => {
        const p = Math.round((g.missing / g.total) * 100);
        return `<tr><td><span class="tag ${p === 100 ? 'blocked' : 'drift'}">${h(ESTADO_TAREFA[st] ?? st)}</span></td>
          <td class="mono">${g.total}</td><td class="mono">${g.missing} (${p}%)</td>
          <td><div class="bar"><i style="width:${p}%;background:var(${p === 100 ? '--danger' : '--warning'})"></i></div></td></tr>`;
      }))
    + '<h2 style="margin-top:8px">Saltos ate a evidência</h2>'
    + table(['saltos', 'tarefas encerradas'], Object.entries(C.reach.hops).sort((a,b)=>Number(a[0])-Number(b[0]))
        .map(([n, q]) => `<tr><td class="mono">${n === '0' ? 'no próprio' : n}</td><td class="mono">${q}</td></tr>`))
    + '<h2>Em que pé estão as tarefas</h2>' + table(['situação', 'quantas'], Object.entries(C.byState).sort((a, b) => b[1] - a[1])
        .map(([s, n]) => `<tr><td>${h(ESTADO_TAREFA[s] ?? s)}${ESTADO_TAREFA[s] ? `<div class="mono muted">${h(s)}</div>` : ''}</td><td class="mono">${n}</td></tr>`))
    + `<h2>Tarefas que terminaram sem dizer por quê (${C.withoutReason.length} mostradas)</h2>`
    + '<div class="muted" style="margin-bottom:6px">Clique numa linha para ver a tarefa inteira.</div>'
    + table(['código', 'como terminou', 'quem fez', 'o que era a tarefa'], C.withoutReason.map((c) => linhaAbrivel(
        `<td class="mono">${h((c.id || '').slice(0, 16))}…</td><td><span class="tag blocked">${h(ESTADO_TAREFA[c.state] ?? c.state)}</span></td>
         <td class="mono muted">${h((c.actor || '—').replace('papel:', ''))}</td>
         <td class="muted">${h((c.statement || '').slice(0, 90))}</td>`,
        dl([
          ['o que era a tarefa', c.statement],
          ['como terminou', ESTADO_TAREFA[c.state] ?? c.state],
          ['quem fez', (c.actor || '').replace('papel:', '') || null],
          ['identificador', c.id],
          ['por que aparece aqui', 'o motivo do encerramento não foi anotado neste registro. A prova do que aconteceu costuma estar no passo anterior, quando o trabalho foi conferido.'],
        ])
      )));
  },

  'Aprendizados': () => {
    const M = D.memory;
    const C = M.canonical ?? {};
    if (C.unavailable) {
      return `<div class="note"><b>NÃO FOI POSSÍVEL LER A FILA</b> — ${h(C.unavailable)}<br>
        <span class="muted">Abaixo fica só a contagem de arquivos do diretório, que inclui histórico. Não e a fila.</span></div>`
        + cards([['arquivos gravados', M.stats.candidatesInDirectory, 'unknown']]);
    }
    return cards([
      ['ESPERANDO VOCÊ', C.stats.total, 'blocked'],
      ['arquivos gravados', M.stats.candidatesInDirectory, 'unknown'],
      ['parado há mais tempo', C.stats.oldestDays + 'd', 'blocked'],
      ['com prova anexada', C.stats.withEvidence],
      ['prova que dá para repetir', C.stats.withCommandEvidence],
      ['que o robô aprova sozinho', M.stats.promotableByAgent, 'blocked'],
    ])
    + `<div class="note"><b>Os dois primeiros números parecem se contradizer, e não se contradizem.</b>
       <b>${C.stats.total}</b> é o que realmente espera a sua decisão hoje.
       <b>${M.stats.candidatesInDirectory}</b> é quantos arquivos existem guardados no computador.
       <br><br>A diferença é o histórico: cada vez que um aprendizado é corrigido, aprovado ou aposentado, o sistema
       <b>guarda a versão antiga em vez de apagar</b>. Contar arquivos seria contar o passado inteiro como se fosse trabalho pendente.</div>`
    + `<h2>Fila de decisão — mais velho primeiro (${C.queue.length} mostrados)</h2>`
    + `<div class="muted">Os de cima estão parados há mais tempo.</div>`
    + '<div class="muted" style="margin-bottom:6px">Clique numa linha para ver a prova inteira e o que decidir.</div>'
    + table(['parado há', 'tipo', 'prova', 'repetido?', 'o que foi aprendido'], C.queue.map((q) => linhaAbrivel(
        `<td class="mono ${q.days >= 14 ? 'blocked' : q.days >= 7 ? 'drift' : ''}">${q.days}d</td>
         <td class="muted">${h(q.proposedKind)}</td>
         <td>${q.hasEvidence ? (q.evidenceLooksLikeCommand ? '<span class="tag ok">comando</span>' : '<span class="tag drift">prosa</span>') : '<span class="tag blocked">FALTA</span>'}</td>
         <td class="muted mono">${q.likelyDuplicateOf.length ? q.likelyDuplicateOf.length + 'x' : '—'}</td>
         <td>${h((q.fact || '').slice(0, 220))}</td>`,
        dl([
          ['afirmação', q.fact],
          ['prova', q.evidence],
          ['tipo de prova', q.evidenceLooksLikeCommand ? 'comando — dá para repetir' : 'prosa — não dá para repetir'],
          ['de onde veio', q.proposedBy],
          ['parado há', q.days + ' dias'],
          ['possíveis duplicatas', q.likelyDuplicateOf.length ? q.likelyDuplicateOf.join(', ') : null],
          ['identificador', q.id],
          ['para aprovar', `nexos memory --promote ${q.id} --why "..."`],
        ])
      )))
    + cardsLegado(M);
  },

  'Ferramentas': () => {
    const MAQ = D.machine;
    const cartaoMaquina = !(MAQ && MAQ.available) ? ''
      : `<h2>esta máquina, agora</h2>` + table(['o quê', 'quanto', 'o que significa'], [
        ['sessões Claude abertas', MAQ.sessions ?? 'não medido', h(MAQ.sessionsMeaning)],
        ['projetos conhecidos', MAQ.projects ?? 'não medido', 'pastas com histórico de sessão'],
        ['carga do processador', MAQ.loadPerCore === null ? 'não medida' : `${MAQ.loadPerCore} por núcleo`,
         `${h(MAQ.loadLabel)} — 1,00 por núcleo é o limite antes de a máquina engasgar (${MAQ.cores ?? '?'} núcleos)`],
      ].map((r) => `<tr><td>${r[0]}</td><td class="num">${r[1]}</td><td class="muted">${r[2]}</td></tr>`))
      + (MAQ.denied.length
        ? `<p class="muted">Não medido porque este ambiente recusou: ${h(MAQ.denied.join(' · '))}. Ausente aqui é ausente de medida, não de valor.</p>`
        : '');
    const C = D.capabilities;
    // O cartão da máquina precede os dois caminhos: capability indisponível
    // não apaga o que JÁ foi medido sobre o computador.
    if (C.unavailable) return cartaoMaquina + `<div class="note"><b>INDISPONÍVEL</b> — ${h(C.unavailable)}<br><span class="muted">Não conseguimos ler esta informação agora. Isso é um fato a mostrar, não uma tela em branco.</span></div>`;
    return cartaoMaquina + cards([
      ['prontas para usar', C.stats.ativas ?? C.stats.total, (C.stats.ativas ?? C.stats.total) ? 'ok' : 'blocked'],
      ['desligadas', C.stats.desligadas ?? 0, C.stats.desligadas ? 'drift' : 'muted'],
      ['no catálogo', C.stats.total, 'muted'],
      ['feitas por nós', C.stats.ours, 'muted'],
      ['que não conseguimos ler', C.stats.unreadableByOurScanner, 'unknown'],
      ['peso na memória', (C.stats.listingChars / 1000).toFixed(0) + 'k chars'],
      ['peso delas', (C.stats.unreadableChars / 1000).toFixed(1) + 'k (' + (C.stats.unreadableChars / C.stats.listingChars * 100).toFixed(1) + '%)'],
    ])
    + (C.stats.desligadas
        ? `<div class="note"><b>${C.stats.desligadas} das ${C.stats.total} estão desligadas</b> — ${Math.round(C.stats.desligadas / C.stats.total * 100)}% do catálogo. `
          + 'Elas existem no disco e o assistente <b>não pode usá-las</b>. Desligar foi decisão de alguém; o que faltava era a tela dizer isso.<br>'
          + '<span class="muted">Um catálogo grande anunciado como capacidade disponível promete o que não entrega — o mesmo defeito que faz um sistema de busca '
          + 'sugerir a ferramenta errada quando a certa está desligada.</span></div>'
        : '')
    + '<h2>O quanto sabemos de cada ferramenta</h2>'
    + '<div class="muted">Cada nível precisa de prova própria: o sistema não assume que uma ferramenta funciona só porque ela existe.</div>'
    + (() => { const nivelPt = {
        INSTALLED: 'está no computador', LISTED: 'aparece na lista', INVOCABLE: 'pode ser usada',
        INVOKED: 'já foi usada alguma vez', EFFECTIVE: 'funcionou de verdade' };
      /**
       *   OMISSÃO DECLARADA, NUNCA OMISSÃO ESQUECIDA
       *
       * `LADDER` (console/capability-projection.mjs) tem SEIS degraus e esta
       * tabela mostra cinco. A lista estava escrita à mão e `DISCOVERED`
       * ficava de fora sem nenhuma linha explicando — indistinguível de
       * esquecimento.
       *
       * Medido: `byRung` não traz `DISCOVERED`. Nenhum produtor emite esse
       * degrau, então não há número para mostrar. A omissão está certa; o
       * silêncio é que não estava. Declarada aqui, um teste confere que
       * traduzidos + omitidos == LADDER, e um degrau novo na fonte reprova
       * até alguém decidir o que fazer com ele.
       */
      const nivelOmitido = {
        DISCOVERED: 'nenhum produtor emite este degrau — não há número a mostrar',
      };
      void nivelOmitido;
      return table(['nível de certeza', 'quantas', 'por quê'], Object.keys(nivelPt).map((r) => `<tr>
        <td><span class="tag ${C.byRung[r] === 0 ? 'blocked' : ''}">${h(nivelPt[r])}</span></td>
        <td class="mono">${C.byRung[r] ?? 0}</td>
        <td class="muted">${h(C.unmeasured[r] ?? '')}</td></tr>`)) + (C.usageScan
        ? `<p class="muted">"já foi usada" medido em ${C.usageScan.transcriptsRead.toLocaleString('pt-BR')} históricos de sessão (${C.usageScan.linesRead.toLocaleString('pt-BR')} linhas${C.usageScan.unreadable ? `, ${C.usageScan.unreadable} ilegíveis` : ''}).</p>`
        : `<p class="muted">"já foi usada" não foi medido desta vez — rode <code>nexos console --usage</code>. Zero aqui quer dizer que ninguém contou, não que ninguém usou.</p>`); })()
    + (() => {
      /**
       *   NOME INTERNO NÃO É NOME DE TELA
       *
       * `skill`, `mcp`, `lsp`, `personal` são o vocabulário do host. Quem
       * abre o painel quer saber O QUE a coisa faz e DE ONDE ela veio — não
       * decorar a sigla que o sistema usa por dentro. O termo original fica
       * como legenda, para quem precisar casar com a documentação.
       */
      const tipoPt = {
        skill: ['habilidade', 'instrução que o assistente carrega quando o assunto casa'],
        agent: ['agente', 'especialista que recebe uma tarefa inteira'],
        command: ['comando', 'atalho que você digita começando com barra'],
        mcp: ['servidor conectado', 'programa externo que expõe ferramentas'],
        plugin: ['extensão', 'pacote que traz várias peças de uma vez'],
        lsp: ['servidor de linguagem', 'analisa o código de uma linguagem específica'],
      };
      const origemPt = {
        personal: ['do seu computador', 'instalada na sua conta, vale em todos os projetos'],
        project: ['deste projeto', 'mora no repositório, vale só aqui'],
        plugin: ['veio de extensão', 'entrou junto com um pacote instalado'],
      };
      /** `n` é o catálogo; a coluna de ativas vem do mapa paralelo. */
      /**
       * `n` é o catálogo; `ativas` é quantas dessas o assistente pode de
       * fato usar. Separar as duas é o ponto: `command` tem 270 no
       * catálogo e 14 ativas, e uma coluna só contando 270 diria o
       * contrário do que acontece.
       */
      const linha = (dic, ativasPor) => ([k, n]) => {
        const [nome, oque] = dic[k] ?? [k, ''];
        /*
         *   "—" É NÃO SEI; "0" É NENHUMA
         *
         * `ativasPor?.[k] ?? null` devolvia null para tipo SEM nenhuma
         * ativa, porque a chave só existe quando alguma ativa foi contada.
         * `lsp` aparecia como "—" tendo 12 no catálogo e ZERO ligadas —
         * justamente o caso que a coluna existe para mostrar. Mapa
         * presente e chave ausente é zero; mapa ausente é que é
         * desconhecido (payload de uma versão anterior).
         */
        const a = ativasPor ? (ativasPor[k] ?? 0) : null;
        const nenhuma = a === 0;
        return `<tr><td><b>${h(nome)}</b>${k !== nome ? ` <span class="muted">${h(k)}</span>` : ''}</td>` +
               `<td class="mono ${nenhuma ? 'blocked' : a !== null && a < n ? 'drift' : ''}">${a === null ? '—' : a}</td>` +
               `<td class="mono muted">${n}</td><td class="muted">${h(oque)}${nenhuma ? ' <b class="blocked">· nenhuma ligada</b>' : ''}</td></tr>`;
      };
      return '<h2>Por tipo</h2>'
        + '<div class="muted">"Prontas" é o que o assistente pode usar agora. "No catálogo" inclui as desligadas, que existem no disco e não respondem.</div>'
        + table(['o que é', 'prontas', 'no catálogo', 'o que significa'], Object.entries(C.byKind).map(linha(tipoPt, C.ativasPorKind)))
        + '<h2>Por origem</h2>'
        + table(['de onde vem', 'prontas', 'no catálogo', 'o que significa'], Object.entries(C.bySource).map(linha(origemPt, C.ativasPorSource)));
    })()
    + `<div class="note"><b>Este número mede uma limitação nossa, não um defeito das ferramentas.</b>
       São ${C.stats.unreadableByOurScanner} ferramentas cuja descrição o nosso leitor não conseguiu extrair.
       A maioria <b>tem</b> descrição escrita — o que falha é a nossa leitura do arquivo.
       <br><br>Os motivos são três e pedem consertos diferentes: o arquivo não tem o bloco de informações,
       ou tem e ficou sem fechamento, ou tem e está mal escrito. Como os consertos são diferentes, juntar tudo
       num número só não ajudaria ninguém. Nenhuma delas é nossa: todas vieram instaladas de fora.</div>`
    + '<h2>Por que não conseguimos ler cada uma</h2>'
    + table(['motivo', 'quantas', 'como consertar'], Object.entries(C.byIssue).map(([k, n]) => `<tr>
        <td><span class="tag ${k === 'INVALID_YAML' ? 'blocked' : 'drift'}">${h({INVALID_YAML:'texto mal escrito', UNTERMINATED:'bloco sem fechamento', NO_FRONTMATTER:'sem bloco de informações', NO_FRONTMATTER_OR_UNKNOWN:'sem bloco, ou motivo não informado'}[k] ?? k)}</span></td>
        <td class="mono">${n}</td>
        <td class="muted">${h(C.issueMeaning[k] ?? 'causa não reportada pelo scanner — desconhecida não é "campo ausente"')}</td></tr>`))
    + `<h2>Que o nosso leitor não conseguiu abrir (${C.unreadable.length} mostradas)</h2>`
    + table(['tipo', 'nome', 'de onde vem', 'peso'], C.unreadable.map((i) => linhaAbrivel(
        `<td class="muted">${h(i.kind)}</td><td class="mono">${h(i.name)}</td>
         <td class="muted">${h(i.source)}</td><td class="mono">${h(i.chars ?? '—')}</td>`,
        dl([
          ['nome', i.name],

/**
 * O orbe é instrumento de estado e precisa do canvas JÁ no DOM: <script> dentro
 * de innerHTML não executa, então montar junto com o HTML não funcionaria.
 */
function montarOrbe() {
  const c = document.getElementById('orb');
  if (!c || c.dataset.pronto) return;
  c.dataset.pronto = '1';
  const o = window.__orb ?? { cor: 'var(--primary)', estado: 'UNKNOWN' };
  const ctx = c.getContext('2d');
  const cor = getComputedStyle(document.documentElement)
    .getPropertyValue(o.cor.replace('var(', '').replace(')', '')).trim() || '#7CFF9E';

  /**
   *   PONTO SOLTO NÃO É NÚCLEO
   *
   * A versão anterior eram 130 partículas numa elipse PLANA, sem ligação e
   * sem brilho — na tela do dono viravam poeira. Um núcleo se lê pela
   * ESTRUTURA: profundidade, nós ligados entre si e densidade no centro.
   *
   * Esfera de Fibonacci (distribuição uniforme sem agrupamento nos polos),
   * rotação em Y com projeção de perspectiva, e arestas pré-computadas
   * pelos vizinhos mais próximos — a topologia não muda com a rotação, então
   * o par é calculado UMA vez e só o desenho acompanha o giro.
   */
  const vel = { CONTINUE: 1, COMPLETE: 0.22, HUMAN_DECISION_REQUIRED: 0.1, BLOCKED: 0.04 }[o.estado] ?? 0;
  const N = 300, R = 132, VIZINHOS = 2;
  const phi = Math.PI * (3 - Math.sqrt(5));
  const nos = Array.from({ length: N }, (_, i) => {
    const y = 1 - (i / (N - 1)) * 2;
    const raio = Math.sqrt(Math.max(0, 1 - y * y));
    const t = phi * i;
    return { x: Math.cos(t) * raio * R, y: y * R, z: Math.sin(t) * raio * R };
  });

  /** Arestas: cada nó liga aos `VIZINHOS` mais próximos, sem repetir o par. */
  const arestas = [];
  const vistos = new Set();
  for (let i = 0; i < N; i++) {
    const d = [];
    for (let j = 0; j < N; j++) {
      if (i === j) continue;
      const dx = nos[i].x - nos[j].x, dy = nos[i].y - nos[j].y, dz = nos[i].z - nos[j].z;
      d.push([dx * dx + dy * dy + dz * dz, j]);
    }
    d.sort((a, b) => a[0] - b[0]);
    for (let k = 0; k < VIZINHOS; k++) {
      const j = d[k][1];
      const chave = i < j ? `${i}-${j}` : `${j}-${i}`;
      if (vistos.has(chave)) continue;
      vistos.add(chave);
      arestas.push([i, j]);
    }
  }

  let ang = 0;
  let w = 0, hh = 0;

  /**
   *   ATRIBUIR canvas.width A CADA QUADRO É REALOCAR O BUFFER A CADA QUADRO
   *
   * Escrever em `canvas.width`/`height` — mesmo o MESMO valor — descarta o
   * bitmap, reinicia o contexto e força o compositor a refazer a camada. A
   * 60fps isso é 60 realocações por segundo, e é o que o dono via como a tela
   * "piscando como se estivesse carregando".
   *
   * Agora o tamanho é lido uma vez e só reescrito quando MUDA de verdade
   * (redimensionar a janela), que é a única situação em que o buffer precisa
   * ser outro. `devicePixelRatio` no lugar do 2 fixo: em tela comum evita
   * pintar o dobro de pixels à toa.
   */
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const ajustar = () => {
    const nw = Math.round(c.clientWidth * dpr);
    const nh = Math.round(c.clientHeight * dpr);
    if (nw === w && nh === hh) return false;
    w = c.width = nw;
    hh = c.height = nh;
    return true;
  };
  ajustar();

  const draw = () => {
    /*   DESISTIR NÃO É ESPERAR
     *
     * Aqui era `if (!w || !hh) { ajustar(); if (!w || !hh) return; }` — um
     * `return` que NÃO reagendava. Quando o primeiro quadro pegava o canvas
     * antes de o layout resolver, `clientWidth` era 0, o loop saía e nunca
     * mais voltava: o `ResizeObserver` corrigia o tamanho e não havia quem
     * chamasse `draw()` de novo. O orbe ficava em branco até recarregar a
     * página, porque no recarregamento o tempo calha diferente.
     *
     * Bug de corrida não aparece na máquina de quem escreveu: aparece na
     * de quem abre a página com o disco ocupado. Agora o quadro sem
     * dimensão espera o próximo em vez de encerrar o loop. */
    if (!w || !hh) { ajustar(); if (!w || !hh) { requestAnimationFrame(draw); return; } }
    ctx.clearRect(0, 0, w, hh);
    ctx.save();
    ctx.translate(w / 2, hh / 2);
    /** O núcleo cabe na menor dimensão, sem esticar em tela ultrawide. */
    const esc = Math.min(w, hh) / (R * 2.6);
    /** Escala do buffer: o desenho é feito em unidades lógicas. */
    ctx.scale(esc, esc);
    ang += 0.0016 * vel;

    const cos = Math.cos(ang), sin = Math.sin(ang);
    const proj = nos.map((n) => {
      const x = n.x * cos + n.z * sin;
      const z = -n.x * sin + n.z * cos;
      /** Perspectiva: o que está atrás encolhe e apaga. */
      const k = 420 / (420 + z);
      return { x: x * k, y: n.y * k, k, z };
    });

    ctx.lineWidth = 0.6;
    for (const [i, j] of arestas) {
      const a = proj[i], b = proj[j];
      const prof = (a.k + b.k) / 2;
      ctx.globalAlpha = Math.max(0, (prof - 0.72) * 0.9);
      ctx.strokeStyle = cor;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    ctx.shadowBlur = 10;
    ctx.shadowColor = cor;
    for (const q of proj) {
      const r = 1.1 * q.k * q.k;
      ctx.globalAlpha = Math.max(0.08, (q.k - 0.7) * 1.9);
      ctx.fillStyle = cor;
      ctx.beginPath();
      ctx.arc(q.x, q.y, r, 0, 6.283);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
    ctx.restore();
    if (vel > 0) requestAnimationFrame(draw);
  };
  draw();

  /* Com movimento, o próprio loop reage ao novo tamanho. Sem movimento
     (`prefers-reduced-motion`) o desenho é único, então redimensionar exige
     redesenhar à mão — senão o orbe fica no tamanho velho, esticado. */
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(() => { if (ajustar() && vel === 0) draw(); }).observe(c);
  }
}

/** Delegação: vale para tabela que ainda nem foi renderizada. */
const alternarLinha = (tr) => {
  const alvo = tr && document.getElementById(tr.dataset.open);
  if (!alvo) return false;
  alvo.hidden = !alvo.hidden;
  tr.classList.toggle('aberta', !alvo.hidden);
  tr.setAttribute('aria-label', alvo.hidden ? 'ver detalhe' : 'ocultar detalhe');
  return true;
};

document.addEventListener('click', (ev) => {
  alternarLinha(ev.target.closest('tr[data-open]'));
});

/** Mesma delegação do `data-open`: vale para paginação criada depois deste script rodar. */
document.addEventListener('click', (ev) => {
  const botao = ev.target.closest('button[data-pagina]');
  if (!botao) return;
  const p = window.__paginas[botao.dataset.pagina];
  if (!p) return;
  const totalPaginas = Math.max(1, Math.ceil(p.linhas.length / p.porPagina));
  p.atual = Math.min(Math.max(0, p.atual + Number(botao.dataset.dir)), totalPaginas - 1);
  const alvo = document.getElementById(botao.dataset.pagina);
  if (alvo) alvo.outerHTML = renderPagina(botao.dataset.pagina);
});

/**
 * Enter e Espaço são o equivalente de teclado do clique. Espaço rola a
 * página por padrão — `preventDefault` só quando a linha REALMENTE abriu,
 * para não sequestrar a rolagem em qualquer outro lugar.
 */
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  const tr = ev.target.closest && ev.target.closest('tr[data-open]');
  if (!tr) return;
  if (alternarLinha(tr)) ev.preventDefault();
});

const tabs = document.getElementById('tabs');
const main = document.getElementById('panes');

/**
 *   ARIA PELA METADE != ARIA
 *
 * `aria-selected` num `<button>` sem `role="tab"` é atributo PROIBIDO, e
 * `role="tablist"` com filhos que não são `tab` reprova `aria-required-children`.
 * O padrão entra inteiro: papéis dos dois lados, ligação bidirecional
 * (`aria-controls`/`aria-labelledby`) e roving tabindex — sem ele são dez
 * paradas de Tab antes de chegar ao conteúdo.
 */
/**
 *   ABA SEM ENDEREÇO NÃO É NAVEGAÇÃO, É ACORDEÃO
 *
 * As onze abas trocavam conteúdo sem tocar na URL. Consequência: recarregar
 * voltava para a primeira, o botão voltar do navegador saía da página
 * inteira em vez de voltar uma aba, e não havia como mandar a alguém o
 * link de uma aba específica — a única forma de chegar em "Estrutura do
 * código" era abrir o painel e clicar.
 *
 * `location.hash` dá rota real sem servidor e sem bundler, que é o que um
 * arquivo aberto por `file://` permite. `#estrutura-do-codigo` abre direto
 * na aba, o histórico do navegador funciona, e o link pode ser colado em
 * qualquer lugar.
 *
 * O slug tira acento de verdade (`normalize('NFD')`): sem isso "Visão
 * geral" viraria `vis-o-geral`, um endereço que ninguém digita e que não
 * sobrevive a renomear a aba.
 */
const slug = (n) => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const idAba = (n) => 'aba-' + slug(n);
const idPainel = (n) => 'painel-' + slug(n);
const nomes = Object.keys(panes);

const selecionar = (name) => {
  if (!nomes.includes(name)) return false;
  [...tabs.children].forEach((x) => {
    const ativo = x.dataset.name === name;
    x.setAttribute('aria-selected', String(ativo));
    x.tabIndex = ativo ? 0 : -1;
    /*
     *   ABRIR NUMA ABA DO FIM NÃO PODE DEIXAR O COLCHETE FORA DA TELA
     *   — MAS `scrollIntoView` MEXE NO PONTO DE PARTIDA DO TAB
     *
     * A faixa de abas rola horizontal no celular (`nav{overflow-x:auto}`).
     * Abrir `#sessoes` direto (ou clicar no HUD, que também chama
     * `selecionar`) deixava a rolagem no ponto de repouso — a aba ativa
     * podia ficar fora da parte visível da faixa.
     *
     * `Element.scrollIntoView` parecia o jeito óbvio — e reproduzia outro
     * defeito: medido pelo verificador, o PRIMEIRO Tab de página recém-
     * carregada ia para `SECTION#painel-visao-geral` (pulando o link do
     * cabeçalho E a aba ativa). Causa provada anulando
     * `Element.prototype.scrollIntoView`: o Chrome usa o alvo da CHAMADA
     * mais recente de `scrollIntoView` como ponto de partida da navegação
     * sequencial por teclado — e `selecionar()` roda no carregamento,
     * chamando `scrollIntoView` na aba ativa ANTES de qualquer Tab.
     *
     * Ajuste manual de `nav.scrollLeft`, comparando os retângulos da aba e
     * da nav, entrega o mesmo resultado visual (rola só o necessário, nada
     * se já estiver visível) sem tocar a API que tem esse efeito colateral.
     */
    if (ativo) {
      const rBtn = x.getBoundingClientRect(), rNav = tabs.getBoundingClientRect();
      if (rBtn.left < rNav.left) tabs.scrollLeft -= (rNav.left - rBtn.left);
      else if (rBtn.right > rNav.right) tabs.scrollLeft += (rBtn.right - rNav.right);
    }
  });
  [...main.children].forEach((sec) => { sec.hidden = sec.dataset.name !== name; });
  montarOrbe();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  /*
   * O endereço acompanha a aba. Atribuir a `location.hash` cria entrada no
   * histórico, então o botão voltar volta UMA aba em vez de sair da
   * página. `file://` não aceita `history.pushState` em todo navegador;
   * hash aceita em todos.
   */
  const alvo = slug(name);
  if (decodeURIComponent(location.hash.slice(1)) !== alvo) location.hash = alvo;
  /*
   * O link para o mapa carrega a aba de origem, para o "voltar" de lá cair
   * onde a pessoa estava. Sem isto, ir ao mapa e voltar custa reencontrar
   * a aba — o tipo de atrito que faz ninguém usar os dois juntos.
   */
  const paraOMapa = document.querySelector('a[href^="graph-view.html"]');
  if (paraOMapa) paraOMapa.href = `graph-view.html#volta=${alvo}`;
  return true;
};

/** Nome da aba a partir do endereço — `#estrutura-do-codigo` → a aba. */
const porSlug = (s) => nomes.find((n) => slug(n) === s);

nomes.forEach((name, i) => {
  const b = document.createElement('button');
  b.textContent = name;
  b.id = idAba(name);
  b.dataset.name = name;
  b.setAttribute('role', 'tab');
  b.setAttribute('aria-controls', idPainel(name));
  b.setAttribute('aria-selected', String(i === 0));
  b.tabIndex = i === 0 ? 0 : -1;
  b.onclick = () => selecionar(name);
  b.addEventListener('keydown', (ev) => {
    const passo = ev.key === 'ArrowRight' ? 1 : ev.key === 'ArrowLeft' ? -1
                : ev.key === 'Home' ? -i : ev.key === 'End' ? nomes.length - 1 - i : null;
    if (passo === null) return;
    ev.preventDefault();
    const alvo = tabs.children[(i + passo + nomes.length) % nomes.length];
    selecionar(alvo.dataset.name);
    alvo.focus();
  });
  tabs.appendChild(b);

  const sec = document.createElement('section');
  sec.dataset.name = name;
  sec.id = idPainel(name);
  sec.setAttribute('role', 'tabpanel');
  sec.setAttribute('aria-labelledby', idAba(name));
  sec.tabIndex = 0;
  sec.hidden = i !== 0;
  sec.innerHTML = panes[name]();
  agrupar(sec);
  main.appendChild(sec);
});

/**
 *   O ENDEREÇO MANDA NA ABERTURA, NÃO A ORDEM DAS ABAS
 *
 * Abrir `console.html#provas` tem que cair em "Provas", não na primeira
 * aba. Endereço desconhecido — porque a aba foi renomeada, ou porque
 * alguém digitou errado — cai na primeira em vez de deixar a tela vazia.
 */
selecionar(porSlug(decodeURIComponent(location.hash.slice(1))) ?? nomes[0]);

/**
 * Voltar e avançar do navegador. O `hashchange` também dispara quando é a
 * própria `selecionar()` que escreve o endereço; comparar com a aba já
 * ativa corta o laço sem precisar de sinalizador de estado, que é a
 * variável que alguém esquece de baixar num caminho de erro.
 */
window.addEventListener('hashchange', () => {
  const nome = porSlug(decodeURIComponent(location.hash.slice(1)));
  if (!nome) return;
  const jaAtiva = document.getElementById(idAba(nome))?.getAttribute('aria-selected') === 'true';
  if (!jaAtiva) selecionar(nome);
});

/**
 * Delegação de `data-goto`: rótulo, número ou alerta que tem aba
 * correspondente leva até ela. Vale para conteúdo que ainda nem foi
 * renderizado, e responde a teclado como qualquer link.
 */
const irParaAba = (el) => {
  const alvo = el && el.closest('[data-goto]');
  return alvo ? selecionar(alvo.dataset.goto) : false;
};
document.addEventListener('click', (ev) => { irParaAba(ev.target); });
document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Enter' && ev.key !== ' ') return;
  if (!ev.target.closest || !ev.target.closest('[data-goto]')) return;
  if (irParaAba(ev.target)) ev.preventDefault();
});

montarOrbe();
</script>
</body>
</html>
